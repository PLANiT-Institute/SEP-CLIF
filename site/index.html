-radius: 2px; display: inline-block; }\n.n2-tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); color: var(--color-fg); white-space: nowrap; z-index: 5; }\n.n2-tip div:first-child { color: var(--cds-text-secondary); }\n.n2-fail { display: flex; align-items: center; justify-content: center; gap: 0.5em; min-height: inherit; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }\n.n2-fail::before { content: \"\"; width: 0.375rem; height: 0.375rem; border-radius: 50%; background: var(--color-bad); }\n.n2-tablebox { max-height: 26rem; overflow: auto; }\n.n2-table { width: 100%; border-collapse: collapse; font-size: var(--cds-font-size-caption); }\n.n2-table th { position: sticky; top: 0; background: var(--color-panel); text-align: left; font-weight: var(--cds-font-weight-medium); padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); }\n.n2-table td { padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); vertical-align: top; }\n.n2-table td:last-child { color: var(--color-fg-muted); max-width: 70ch; white-space: pre-wrap; }\n.n2 details { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }\n.n2 details summary { cursor: pointer; color: var(--color-fg); }\n.n2 dl { display: grid; grid-template-columns: minmax(8rem, max-content) 1fr; gap: var(--cds-gap-xs) var(--cds-gap-md); margin: var(--cds-gap-sm) 0 0; }\n.n2 dt { color: var(--color-fg); }\n.n2 dd { margin: 0; }\n.n2-filter { display: flex; flex-wrap: wrap; gap: var(--cds-gap-xs); }\n.n2-filter button { font: inherit; font-size: var(--cds-font-size-caption); background: none; border: 1px solid var(--color-border-line); border-radius: 999px; padding: 2px 10px; color: var(--color-fg-muted); cursor: pointer; }\n.n2-filter button[aria-pressed=\"true\"] { color: var(--color-fg); border-color: var(--color-fg); }\n.n2-dbdet { margin-top: var(--cds-gap-md); }\n.n2-dbdet > summary { font-size: var(--cds-font-size-body); margin-bottom: var(--cds-gap-sm); }\n.n2-sl td:nth-child(7) { max-width: 28ch; }\n.n2-db td:nth-child(7) { white-space: nowrap; font-weight: var(--cds-font-weight-medium); }\n.n2-db td:last-child { color: var(--color-fg); }\n.n2-sl td:nth-child(5) { white-space: nowrap; font-weight: var(--cds-font-weight-medium); }\n.n2-sl td:last-child { color: var(--color-fg); }\n.n2-sl td:nth-child(3), .n2-sl td:nth-child(4) { color: var(--color-fg-muted); max-width: 22ch; }\n.n2-badge { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 2px; margin-right: 0.35em; vertical-align: baseline; }\n[data-dash-source-state=empty] { color: transparent; }\n[data-dash-source-state=refreshing] { opacity: .5; transition: opacity var(--cds-dur-slow); }\n.n2-src a, .n2-table a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }\n<\/style>\n\n<div class=\"n2\">\n  <header class=\"n2-head\">\n    <h1 class=\"n2-title\">Power for AI data centres: what do renewables offer?<\/h1>\n    <p class=\"n2-lede\">Storyline steps ①–⑤ of the brief, shown with results from VOID sessions S1–S5. Demand is rising fast, gas plants take long to build and their fuel cost swings, and mixing solar with wind reduces hour-to-hour variability. v2 sets future demand to one outlook: the 12th Basic Plan’s demand re-forecast (5th public hearing, '26.8.20, provisional).<\/p>\n  <\/header>\n\n  <nav class=\"n2-tabs\" role=\"tablist\" aria-label=\"Storyline steps\">\n    <button class=\"n2-tab\" role=\"tab\" id=\"tab-s1\" data-tab=\"s1\" aria-selected=\"true\">① Power is the bottleneck<\/button>\n    <button class=\"n2-tab\" role=\"tab\" id=\"tab-s2\" data-tab=\"s2\" aria-selected=\"false\">② Is gas fast?<\/button>\n    <button class=\"n2-tab\" role=\"tab\" id=\"tab-s3\" data-tab=\"s3\" aria-selected=\"false\">③ Hidden costs of gas<\/button>\n    <button class=\"n2-tab\" role=\"tab\" id=\"tab-s4\" data-tab=\"s4\" aria-selected=\"false\">④ Renewable portfolio<\/button>\n    <button class=\"n2-tab\" role=\"tab\" id=\"tab-s5\" data-tab=\"s5\" aria-selected=\"false\">⑤ Clean-power strategy<\/button>\n  <\/nav>\n\n  <!-- ① -->\n  <section class=\"n2-sec\" id=\"s1\" data-sec=\"s1\" role=\"tabpanel\" aria-labelledby=\"tab-s1\">\n    <h2 class=\"n2-q\">Power is the new bottleneck for the AI industry<\/h2>\n    <p class=\"n2-claim\">The 12th Basic Plan re-forecast (5th public hearing, provisional) puts data-centre consumption in '40 at <b data-draw=\"s1-twh\" data-source=\"dc_demand\" data-field=\"total_twh\" data-where=\"plan=12th_redraft\">—<\/b>TWh — more than three times the 11th Basic Plan ('38 reaches <b data-draw=\"s1-twh11\" data-source=\"dc_demand\" data-field=\"total_twh\" data-where=\"year=2038\">—<\/b>TWh). Yet in KEPCO’s review (as of '23 Aug), of the supply applications received, by '27 only <b data-draw=\"s1-share\" data-source=\"dc_supply_share\" data-field=\"share\">—<\/b> were judged suppliable.<\/p>\n    <div class=\"n2-tiles\">\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Data-centre consumption '40<\/span><span class=\"n2-tile-value\"><span data-draw=\"s1-t1\" data-source=\"dc_demand\" data-field=\"total_twh\" data-where=\"plan=12th_redraft\">—<\/span><span class=\"n2-unit\">TWh<\/span><\/span><span class=\"n2-tile-note\">12th re-forecast. Net of trend <span data-draw=\"s1-t1b\" data-source=\"dc_demand\" data-field=\"increment_twh\" data-where=\"plan=12th_redraft\">—<\/span>TWh<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Peak '40<\/span><span class=\"n2-tile-value\"><span data-draw=\"s1-t2\" data-source=\"dc_demand\" data-field=\"total_gw\" data-where=\"plan=12th_redraft\">—<\/span><span class=\"n2-unit\">GW<\/span><\/span><span class=\"n2-tile-note\">11th Plan '38 <span data-draw=\"s1-t2b\" data-source=\"dc_demand\" data-field=\"total_gw\" data-where=\"year=2038\">—<\/span>GW<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Supply applications '27 cumulative<\/span><span class=\"n2-tile-value\"><span data-draw=\"s1-t3\" data-source=\"dc_applications\" data-field=\"applied_mw_cum\" data-where=\"year=2027\">—<\/span><span class=\"n2-unit\">MW<\/span><\/span><span class=\"n2-tile-note\">Contracted capacity, as of '23 Aug<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Not judged suppliable<\/span><span class=\"n2-tile-value\"><span data-draw=\"s1-t4\" data-source=\"dc_applications\" data-field=\"gap_mw\" data-where=\"year=2027\">—<\/span><span class=\"n2-unit\">MW<\/span><\/span><span class=\"n2-tile-note\">'27, as of '23 Aug<\/span><\/div>\n    <\/div>\n    <div class=\"n2-grid\">\n      <div class=\"n2-card\"><h3 id=\"c-dc-demand\">Data-centre power demand outlook<\/h3><p>Bars: consumption (TWh); dots: peak (GW). '23 actual; '25~'38 the 11th Basic Plan; '40 the 12th Basic Plan’s initial ('26 Apr) and re-forecast ('26 Aug, provisional). The 12th Plan’s increment is net of trend; the 11th Plan’s is the increment over trend (additional demand).<\/p><div class=\"n2-chart\" data-draw=\"dc-demand\" data-source=\"dc_demand\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-m\"><\/i>Actual<\/span><span><i data-draw=\"sw-a\"><\/i>11th Basic Plan<\/span><span><i data-draw=\"sw-gas2\"><\/i>12th initial<\/span><span><i data-draw=\"sw-gas\"><\/i>12th re-forecast<\/span><span><i data-draw=\"sw-b\"><\/i>Peak<\/span><\/div><span class=\"n2-src\">MOTIE, 11th Basic Plan for Electricity Supply and Demand (2024–2038), revised notice 2025.3.13, annex 6 p.22 · Ministry of Climate and the 12th Plan steering committee, slides of the 5th public hearing on the demand re-forecast, p.11 (2026.8.20, <a href=\"https://www.youtube.com/watch?v=egfHkMqV-HA\" target=\"_blank\" rel=\"noopener\">hearing video<\/a>, <a href=\"https://naver.me/GGG5lbiF\" target=\"_blank\" rel=\"noopener\">download slides<\/a>)<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-dc-app\">Applications vs judged suppliable<\/h3><p>KEPCO review, cumulative contracted capacity. '23 Aug basis.<\/p><div class=\"n2-chart\" data-draw=\"dc-app\" data-source=\"dc_applications\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-m\"><\/i>Supply applications<\/span><span><i data-draw=\"sw-a\"><\/i>Suppliable<\/span><\/div><span class=\"n2-src\">MOTIE, 11th Basic Plan for Electricity Supply and Demand (2024–2038), revised notice 2025.3.13, annex 6 p.21 (KEPCO review as of Aug 2023)<\/span><\/div>\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-aidc-tl\">AIDC power outlook and bottleneck signals, 11th Plan → 12th Plan drafting<\/h3><p>The 12th Basic Plan is not final yet. 'Official' rows are government documents and hearing slides; 'Press' rows are reported values. The hearing’s data-centre '40 net increment of 11.9GW was flagged for a downward revision in '26 Oct.<\/p>\n        <div class=\"n2-tablebox\"><table class=\"n2-table\" data-source=\"aidc_timeline\" data-row-key=\"date,statement\"><thead><tr><th data-field=\"date\">Date<\/th><th data-field=\"stream\">Stream<\/th><th data-field=\"kind\">Basis<\/th><th data-field=\"statement\">Content<\/th><th data-field=\"url\">Source<\/th><\/tr><\/thead><tbody data-draw=\"aidc-tl\"><\/tbody><\/table><\/div>\n        <span class=\"n2-src\">Government sources: the 11th Basic Plan · MSIT press release <a href=\"https://www.korea.kr/briefing/pressReleaseView.do?newsId=156760349\" target=\"_blank\" rel=\"noopener\">on the AI Data Centre Special Act passing the National Assembly<\/a> (2026.5.7) · slides of the 12th Plan 4th–5th hearings (2026.8.20, <a href=\"https://naver.me/GGG5lbiF\" target=\"_blank\" rel=\"noopener\">download slides<\/a>) · MSIT–Ministry of Climate press release <a href=\"https://www.korea.kr/briefing/pressReleaseView.do?newsId=156790061\" target=\"_blank\" rel=\"noopener\">on grid-impact assessment reform for fast AIDC build-out<\/a> (2026.11.20). Press rows link to the article in the table.<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ② -->\n  <section class=\"n2-sec\" id=\"s2\" data-sec=\"s2\" role=\"tabpanel\" aria-labelledby=\"tab-s2\" hidden>\n    <h2 class=\"n2-q\">Is gas power a fast fix?<\/h2>\n    <p class=\"n2-claim\">Linking 10 editions of the KPX pipeline report and looking only at finished projects, the median from generation licence to completion is: solar <b data-draw=\"s2-c1\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=Solar PV&amp;status=completed_est\">—<\/b>yr, LNG combined cycle <b data-draw=\"s2-c2\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=LNG combined cycle&amp;status=completed_est\">—<\/b>yr, onshore wind <b data-draw=\"s2-c7\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=Onshore wind&amp;status=completed_est\">—<\/b>yr. Projects still under way have taken, or are planned to take, from first licence: solar <b data-draw=\"s2-c8\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=Solar PV&amp;status=in_progress\">—<\/b>yr, LNG combined cycle <b data-draw=\"s2-c9\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=LNG combined cycle&amp;status=in_progress\">—<\/b>yr. Of the licensed offshore wind <b data-draw=\"s2-c3\" data-source=\"kpx_permitted\" data-field=\"permitted_mw\" data-where=\"tech=Offshore wind\">—<\/b>MW, only <b data-draw=\"s2-c4\" data-source=\"kpx_permitted\" data-field=\"submitted_mw\" data-where=\"tech=Offshore wind\">—<\/b>MW has a submitted schedule.<\/p>\n    <div class=\"n2-tiles\">\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Solar licence→completion<\/span><span class=\"n2-tile-value\"><span data-draw=\"s2-t1\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=Solar PV&amp;status=completed_est\">—<\/span><span class=\"n2-unit\">yr<\/span><\/span><span class=\"n2-tile-note\">Finished <span data-draw=\"s2-n1\" data-source=\"dur_cross\" data-field=\"n_with_span\" data-where=\"subset=all&amp;tech=Solar PV&amp;status=completed_est\">—<\/span>. Under way <span data-draw=\"s2-p1\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=Solar PV&amp;status=in_progress\">—<\/span>yr<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Onshore wind<\/span><span class=\"n2-tile-value\"><span data-draw=\"s2-t2\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=Onshore wind&amp;status=completed_est\">—<\/span><span class=\"n2-unit\">yr<\/span><\/span><span class=\"n2-tile-note\">Finished <span data-draw=\"s2-n2\" data-source=\"dur_cross\" data-field=\"n_with_span\" data-where=\"subset=all&amp;tech=Onshore wind&amp;status=completed_est\">—<\/span>. Under way <span data-draw=\"s2-p2\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=Onshore wind&amp;status=in_progress\">—<\/span>yr<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">LNG combined cycle<\/span><span class=\"n2-tile-value\"><span data-draw=\"s2-t3\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=LNG combined cycle&amp;status=completed_est\">—<\/span><span class=\"n2-unit\">yr<\/span><\/span><span class=\"n2-tile-note\">Finished <span data-draw=\"s2-n3\" data-source=\"dur_cross\" data-field=\"n_with_span\" data-where=\"subset=all&amp;tech=LNG combined cycle&amp;status=completed_est\">—<\/span>. Under way <span data-draw=\"s2-p3\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=LNG combined cycle&amp;status=in_progress\">—<\/span>yr<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Offshore wind<\/span><span class=\"n2-tile-value\"><span data-draw=\"s2-t4\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=Offshore wind&amp;status=completed_est\">—<\/span><span class=\"n2-unit\">yr<\/span><\/span><span class=\"n2-tile-note\">Finished <span data-draw=\"s2-n4\" data-source=\"dur_cross\" data-field=\"n_with_span\" data-where=\"subset=all&amp;tech=Offshore wind&amp;status=completed_est\">—<\/span>. Under way <span data-draw=\"s2-p4\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=Offshore wind&amp;status=in_progress\">—<\/span>yr<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Nuclear<\/span><span class=\"n2-tile-value\"><span data-draw=\"s2-t5\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=Nuclear&amp;status=completed_est\">—<\/span><span class=\"n2-unit\">yr<\/span><\/span><span class=\"n2-tile-note\">Finished <span data-draw=\"s2-n5\" data-source=\"dur_cross\" data-field=\"n_with_span\" data-where=\"subset=all&amp;tech=Nuclear&amp;status=completed_est\">—<\/span>. Under way <span data-draw=\"s2-p5\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=Nuclear&amp;status=in_progress\">—<\/span>yr<\/span><\/div>\n    <\/div>\n    <div class=\"n2-grid\">\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-dur-cross\">Licence → completion: finished vs under-way projects<\/h3><p>Years, median; brackets give the number of projects. Finished projects link the KPX pipeline editions ('16Q4~'26 H1) and take the completion date listed just before a project left the list (the 25 that can be checked against KPX’s completed-projects table differ by −5 to +2 months). The licence date is the earliest in any edition. Finished projects lean fast and projects under way lean slow. Offshore wind, fuel cells, bioenergy and nuclear have only 1–3 finished projects.<\/p><div class=\"n2-chart\" data-draw=\"dur-cross\" data-source=\"dur_cross\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-a\"><\/i>Finished projects<\/span><span><i data-draw=\"sw-m\"><\/i>Under way (from first licence)<\/span><\/div><span class=\"n2-src\">KPX, Power Plant Construction Status report, 10 editions from 2016 Q4 to 2026 H1 (2022 Q4 left out: its PDF text cannot be read)<\/span><\/div>\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-dur\">Licence → (planned) completion by project<\/h3><p>'26 H1 edition only. One dot per project; vertical bars are medians. Completion includes planned dates, so these are planned durations, and renewables’ licence dates are the latest (amended) licence printed in this edition, so they come out shorter than above. Central plants use the first licence on each project’s detail page. Hollow dots are LNG district-energy projects that sat on their licence (licence→completion over 15 years): shown, but left out of the median. Hover for plant names and licence history.<\/p><div class=\"n2-chart n2-tall\" data-draw=\"dur\" data-source=\"kpx_durations\"><\/div><span class=\"n2-src\">KPX, Power Plant Construction Status report, 2026 H1 (as of 31 Mar, as filed by developers)<\/span><\/div>\n      <div class=\"n2-card n2-card-third\"><h3 id=\"c-iea\">Global construction periods<\/h3><p>Typical projects, excluding supply-chain equipment delays. Grid connection 3–7+ yr.<\/p><div class=\"n2-chart\" data-draw=\"iea\" data-source=\"iea_build\"><\/div><span class=\"n2-src\">IEA, <a href=\"https://www.iea.org/files/de9dea13-b07d-42c5-a398-d1b3ae17d866/EnergyandAI.pdf\" target=\"_blank\" rel=\"noopener\">Energy and AI<\/a> (2025), Table 2.3<\/span><\/div>\n      <div class=\"n2-card n2-card-third\"><h3 id=\"c-irena\">Korea: annual net capacity additions by source<\/h3><p>Year-on-year change in capacity (GW). Negative values and spikes such as LNG in '02·'05 mix retirements with statistical reclassification.<\/p><div class=\"n2-chart\" data-draw=\"irena\" data-source=\"irena_additions\"><\/div><div class=\"n2-legend\" data-draw=\"irena-legend\"><\/div><span class=\"n2-src\">IRENA, Renewable Energy Statistics 2026, IRENASTAT <a href=\"https://pxweb.irena.org/api/v1/en/IRENASTAT/Power%20Capacity%20and%20Generation/Country_ELECSTAT_2026_H2_PX.px\" target=\"_blank\" rel=\"noopener\">Country_ELECSTAT_2026_H2<\/a>: year-on-year change in Korea’s installed capacity (MW) by technology. LNG is IRENA’s Natural gas.<\/span><\/div>\n      <div class=\"n2-card n2-card-third\"><h3 id=\"c-perm\">Licensed vs schedule submitted<\/h3><p>Capacity of generation licences (>3MW) with a status submission (GW).<\/p><div class=\"n2-chart\" data-draw=\"perm\" data-source=\"kpx_permitted\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-m\"><\/i>Licensed<\/span><span><i data-draw=\"sw-a\"><\/i>Status submitted<\/span><\/div><span class=\"n2-src\">KPX, Power Plant Construction Status report, 2026 H1, p.11<\/span><\/div>\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-entry\">Renewables scheduled to enter, by year<\/h3><p>GW/yr. Bars are the entry schedule developers filed with KPX (only licences over 3MW, so small solar is missing); lines are each plan’s yearly additions. The 11th Plan gives each year; the others are the average pace between their target years. '26–'30 the 1st RE Basic Plan (dashed) and the 12th Plan draft are almost equal, so their lines overlap. Other sources (bioenergy, fuel cells, etc.) are left out. Hover for values.<\/p><div class=\"n2-chart\" data-draw=\"entry\" data-source=\"kpx_re_entry\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-solar\"><\/i>Solar PV, KPX filings<\/span><span><i data-draw=\"sw-wind\"><\/i>Wind, KPX filings<\/span><span><i data-draw=\"sw-fg\"><\/i>11th Basic Plan<\/span><span><i data-draw=\"sw-nuc\"><\/i>1st RE Basic Plan<\/span><span><i data-draw=\"sw-gas\"><\/i>12th Basic Plan draft<\/span><\/div><span class=\"n2-src\">KPX, Power Plant Construction Status report, 2026 H1, p.10 · Plans: 11th Basic Plan p.105 · MOTIE, 1st Renewable Energy Basic Plan p.17 · 12th Plan renewables outlook draft (2026.8.26, <a href=\"https://news.tf.co.kr/read/economy/2358341.htm\" target=\"_blank\" rel=\"noopener\">The Fact report<\/a>, not final)<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ③ -->\n  <section class=\"n2-sec\" id=\"s3\" data-sec=\"s3\" role=\"tabpanel\" aria-labelledby=\"tab-s3\" hidden>\n    <h2 class=\"n2-q\">The hidden cost of gas is long-term uncertainty<\/h2>\n    <p class=\"n2-claim\">LNG generation fuel cost has ranged, since '11, from <b data-draw=\"s3-c1\" data-source=\"fuel_range\" data-field=\"min\">—<\/b>KRW/kWh to <b data-draw=\"s3-c2\" data-source=\"fuel_range\" data-field=\"max\">—<\/b>KRW/kWh — <b data-draw=\"s3-c3\" data-source=\"fuel_range\" data-field=\"ratio\">—<\/b>× apart. As long as the fuel is imported, this range will not narrow.<\/p>\n    <div class=\"n2-tiles\">\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">LNG fuel cost, latest month<\/span><span class=\"n2-tile-value\"><span data-draw=\"s3-t1\" data-source=\"fuel_range\" data-field=\"latest\">—<\/span><span class=\"n2-unit\">KRW/kWh<\/span><\/span><span class=\"n2-tile-note\" data-draw=\"s3-t1m\" data-source=\"fuel_range\" data-field=\"latest_month\">—<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">'11 peak<\/span><span class=\"n2-tile-value\"><span data-draw=\"s3-t2\" data-source=\"fuel_range\" data-field=\"max\">—<\/span><span class=\"n2-unit\">KRW/kWh<\/span><\/span><span class=\"n2-tile-note\" data-draw=\"s3-t2m\" data-source=\"fuel_range\" data-field=\"max_month\">—<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Carbon cost at KAU26, '26<\/span><span class=\"n2-tile-value\"><span data-draw=\"s3-t3\" data-source=\"carbon_alloc\" data-field=\"kau26_actual\" data-where=\"year=2026\">—<\/span><span class=\"n2-unit\">KRW/kWh<\/span><\/span><span class=\"n2-tile-note\">15% auctioned share. Fully auctioned: <span data-draw=\"s3-t3b\" data-source=\"carbon_alloc\" data-field=\"kau26_full\" data-where=\"year=2026\">—<\/span> KRW<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">'30 at KRW 100k/t carbon<\/span><span class=\"n2-tile-value\"><span data-draw=\"s3-t4\" data-source=\"carbon_alloc\" data-field=\"k100_actual\" data-where=\"year=2030\">—<\/span><span class=\"n2-unit\">KRW/kWh<\/span><\/span><span class=\"n2-tile-note\">50% auctioned share; price assumed. Fully auctioned: <span data-draw=\"s3-t4b\" data-source=\"carbon_alloc\" data-field=\"k100_full\" data-where=\"year=2030\">—<\/span> KRW<\/span><\/div>\n    <\/div>\n    <div class=\"n2-grid\">\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-fuel\">Fuel cost by source, monthly<\/h3><p>KRW/kWh, '01.4~'26.9.<\/p><div class=\"n2-chart\" data-draw=\"fuel\" data-source=\"fuel_monthly\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-gas\"><\/i>LNG<\/span><span><i data-draw=\"sw-coal\"><\/i>Bituminous coal<\/span><span><i data-draw=\"sw-nuc\"><\/i>Nuclear<\/span><\/div><span class=\"n2-src\">KPX Electric Power Statistics Information System (<a href=\"https://epsis.kpx.or.kr\" target=\"_blank\" rel=\"noopener\">EPSIS<\/a>), fuel unit cost by source, monthly (2001.4–2026.9)<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-sens\">Fuel cost by LNG price × exchange rate<\/h3><p>Cells in KRW/kWh. Heat rate 1.749 Mcal/kWh ('21–'26 KPX median).<\/p><div class=\"n2-chart\" data-draw=\"sens\" data-source=\"lng_sensitivity\"><\/div><span class=\"n2-src\"><a href=\"https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx\" target=\"_blank\" rel=\"noopener\">World Bank Pink Sheet<\/a> LNG (Japan), monthly · <a href=\"https://data.ecb.europa.eu/data/datasets/EXR\" target=\"_blank\" rel=\"noopener\">ECB exchange rates<\/a> · computed with KPX <a href=\"https://epsis.kpx.or.kr\" target=\"_blank\" rel=\"noopener\">EPSIS<\/a> fuel unit costs<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-carbon\">CCGT carbon cost at the auctioned share<\/h3><p>KRW/kWh. Bars: actual burden (price × 390 gCO₂/kWh × the power sector’s auctioned share); dashed lines: the full-auction upper bound. KRW 50k and 100k/t are assumptions. Freely allocated allowances are simplified as costless.<\/p><div class=\"n2-chart\" data-draw=\"carbon\" data-source=\"carbon_alloc\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-m\"><\/i>KAU26 latest price<\/span><span><i data-draw=\"sw-gas2\"><\/i>KRW 50k/t<\/span><span><i data-draw=\"sw-gas\"><\/i>KRW 100k/t<\/span><\/div><span class=\"n2-src\">KRX <a href=\"https://ets.krx.co.kr/contents/ETS/03/03010000/ETS03010000.jsp\" target=\"_blank\" rel=\"noopener\">emissions market platform<\/a> KAU closing prices (internal use) · IEA <a href=\"https://www.iea.org/files/de9dea13-b07d-42c5-a398-d1b3ae17d866/EnergyandAI.pdf\" target=\"_blank\" rel=\"noopener\">Energy and AI<\/a> Table 2.3 emission factor · Ministry of Climate explanatory release <a href=\"https://www.korea.kr/briefing/pressReleaseView.do?newsId=156727612\" target=\"_blank\" rel=\"noopener\">on the phased rise of the power sector’s auction share<\/a> (2025.11.11)<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ④ -->\n  <section class=\"n2-sec\" id=\"s4\" data-sec=\"s4\" role=\"tabpanel\" aria-labelledby=\"tab-s4\" hidden>\n    <h2 class=\"n2-q\">A renewable portfolio offers a different option<\/h2>\n    <p class=\"n2-claim\">In 2025 the hourly correlation of solar and wind was <b data-draw=\"s4-c1\" data-source=\"re_correlation\" data-field=\"pearson_r_solar_wind\" data-where=\"resolution=hourly\">—<\/b>. The hourly coefficient of variation falls from <b data-draw=\"s4-c2\" data-source=\"mix_variability\" data-field=\"hourly_cv_pct\" data-row=\"0\">—<\/b>% for solar alone to <b data-draw=\"s4-c3\" data-source=\"mix_variability\" data-field=\"hourly_cv_pct\" data-row=\"3\">—<\/b>% for a 3:7 solar:wind mix. The daily coefficient of variation, however, rises to <b data-draw=\"s4-c4\" data-source=\"mix_variability\" data-field=\"daily_cv_pct\" data-row=\"3\">—<\/b>% for 3:7, above solar alone (<b data-draw=\"s4-c5\" data-source=\"mix_variability\" data-field=\"daily_cv_pct\" data-row=\"0\">—<\/b>%). One year (2025) of market-traded volumes.<\/p>\n    <div class=\"n2-tiles\">\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Hourly correlation r<\/span><span class=\"n2-tile-value\" data-draw=\"s4-t1\" data-source=\"re_correlation\" data-field=\"pearson_r_solar_wind\" data-where=\"resolution=hourly\">—<\/span><span class=\"n2-tile-note\">Solar vs wind<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Daily correlation r<\/span><span class=\"n2-tile-value\" data-draw=\"s4-t2\" data-source=\"re_correlation\" data-field=\"pearson_r_solar_wind\" data-where=\"resolution=daily\">—<\/span><span class=\"n2-tile-note\">Daily means<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Monthly correlation r<\/span><span class=\"n2-tile-value\" data-draw=\"s4-t3\" data-source=\"re_correlation\" data-field=\"pearson_r_solar_wind\" data-where=\"resolution=monthly\">—<\/span><span class=\"n2-tile-note\">Solar peaks in spring, wind in winter<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Hours below 20% of mean<\/span><span class=\"n2-tile-value\"><span data-draw=\"s4-t4\" data-source=\"mix_variability\" data-field=\"hours_below_20pct_of_mean_pct\" data-row=\"3\">—<\/span><span class=\"n2-unit\">%<\/span><\/span><span class=\"n2-tile-note\">3:7 mix; solar alone <span data-draw=\"s4-t4b\" data-source=\"mix_variability\" data-field=\"hours_below_20pct_of_mean_pct\" data-row=\"0\">—<\/span>%<\/span><\/div>\n    <\/div>\n    <div class=\"n2-grid\">\n      <div class=\"n2-card\"><h3 id=\"c-hm-solar\">Solar capacity factor: hour × month<\/h3><p>2025; capacity factor (%) = traded energy ÷ capacity.<\/p><div class=\"n2-chart\" data-draw=\"hm-solar\" data-source=\"hour_month\"><\/div><span class=\"n2-src\">KPX, hourly traded energy and capacity by fuel, 2025 (<a href=\"https://www.data.go.kr\" target=\"_blank\" rel=\"noopener\">Public Data Portal<\/a>)<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-hm-wind\">Wind capacity factor: hour × month<\/h3><p>The source does not split onshore and offshore.<\/p><div class=\"n2-chart\" data-draw=\"hm-wind\" data-source=\"hour_month\"><\/div><span class=\"n2-src\">Same source<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-mix\">Mixing reduces hour-to-hour variability<\/h3><p>Variability metrics (%) by annual energy share. At daily resolution 7:3 is lowest and 3:7 is higher than solar alone. Solar includes evening discharge of co-located ESS. No ESS or grid effects modelled.<\/p><div class=\"n2-chart\" data-draw=\"mix\" data-source=\"mix_variability\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-m\"><\/i>Hourly CV<\/span><span><i data-draw=\"sw-a\"><\/i>Daily CV<\/span><span><i data-draw=\"sw-gas\"><\/i>Hours below 20% of mean<\/span><\/div><span class=\"n2-src\">Computed from the same source<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-shape\">Daily shape vs total market volume<\/h3><p>Daily mean = 1. Total volume is the sum of market trades across all fuels (incl. pumped hydro and ESS, excl. self-use and PPA solar), so it is not demand.<\/p><div class=\"n2-chart\" data-draw=\"shape\" data-source=\"daily_shape\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-fg\"><\/i>Total volume<\/span><span><i data-draw=\"sw-solar\"><\/i>Solar PV<\/span><span><i data-draw=\"sw-wind\"><\/i>Wind<\/span><\/div><span class=\"n2-src\">Same source<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ⑤ -->\n  <section class=\"n2-sec\" id=\"s5\" data-sec=\"s5\" role=\"tabpanel\" aria-labelledby=\"tab-s5\" hidden>\n    <h2 class=\"n2-q\">AI competitiveness depends on a strategy for securing clean power<\/h2>\n    <p class=\"n2-claim\">If renewables, not LNG, supply the 12th re-forecast’s '40 data-centre net increment of 84.9TWh, '25 natural-gas imports fall by <b data-draw=\"s5-c1\" data-source=\"re_substitution\" data-field=\"share_of_2025_gas_import_pct\" data-where=\"re_twh_replacing_lng=84.9\">—<\/b>% (<b data-draw=\"s5-c5\" data-source=\"re_substitution\" data-field=\"share_of_2025_power_chp_input_pct\" data-where=\"re_twh_replacing_lng=84.9\">—<\/b>% of power + CHP input) and fuel cost by KRW <b data-draw=\"s5-c2\" data-source=\"re_substitution\" data-field=\"fuel_cost_saving_trillion_krw_2025avg\" data-where=\"re_twh_replacing_lng=84.9\">—<\/b>tn. For reference, in the KEEI long-term outlook reference case (published before the 12th re-forecast), by '50, even with variable renewables at <b data-draw=\"s5-c3\" data-source=\"keei_power\" data-field=\"2050\" data-where=\"block=capacity_gw&amp;source=- Variable renewables\">—<\/b>GW, gas generation is still <b data-draw=\"s5-c4\" data-source=\"keei_power\" data-field=\"2050\" data-where=\"block=generation_twh&amp;source=Gas\">—<\/b>TWh. Under the 11th Basic Plan, LNG generation falls to <b data-draw=\"s5-c6\" data-source=\"gas_paths\" data-field=\"gas_twh\" data-where=\"source=11th Basic Plan&amp;year=2038\">—<\/b>TWh by 2038; the gap between the two paths is what carrying out the plan must close.<\/p>\n    <div class=\"n2-tiles\">\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">Fuel saving if renewables supply the DC net 84.9TWh<\/span><span class=\"n2-tile-value\"><span data-draw=\"s5-t1\" data-source=\"re_substitution\" data-field=\"fuel_cost_saving_trillion_krw_2025avg\" data-where=\"re_twh_replacing_lng=84.9\">—<\/span><span class=\"n2-unit\">tn KRW/yr<\/span><\/span><span class=\"n2-tile-note\">'25 average fuel cost<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">LNG avoided<\/span><span class=\"n2-tile-value\"><span data-draw=\"s5-t2\" data-source=\"re_substitution\" data-field=\"lng_mt_avoided\" data-where=\"re_twh_replacing_lng=84.9\">—<\/span><span class=\"n2-unit\">Mt/yr<\/span><\/span><span class=\"n2-tile-note\">Renewables supplying the DC net 84.9TWh<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">'25 natural-gas imports<\/span><span class=\"n2-tile-value\"><span data-draw=\"s5-t3\" data-source=\"gas_power_share\" data-field=\"import_pj\" data-where=\"year=2025\">—<\/span><span class=\"n2-unit\">PJ<\/span><\/span><span class=\"n2-tile-note\">Power + CHP input <span data-draw=\"s5-t3b\" data-source=\"gas_power_share\" data-field=\"share\" data-where=\"year=2025\">—<\/span><\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">11th Plan '38 LNG generation<\/span><span class=\"n2-tile-value\"><span data-draw=\"s5-t4\" data-source=\"gas_paths\" data-field=\"gas_twh\" data-where=\"source=11th Basic Plan&amp;year=2038\">—<\/span><span class=\"n2-unit\">TWh<\/span><\/span><span class=\"n2-tile-note\">KEEI reference case '40 <span data-draw=\"s5-t4b\" data-source=\"gas_paths\" data-field=\"gas_twh\" data-where=\"source=KEEI reference case&amp;year=2040\">—<\/span>TWh<\/span><\/div>\n    <\/div>\n    <div class=\"n2-grid\">\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-gen-mix\">Generation by source: 11th Basic Plan vs KEEI reference outlook<\/h3><p>TWh, stacked. Each bar is that year’s total generation, with gas at the bottom. The two sources are not joined; each is shown in year order. The 11th Plan is the government plan with its GHG target as a constraint (’'23 actual); KEEI is a reference outlook that does not impose policy targets (’'24 base value). KEEI’s renewables include hydro; hydrogen & new energy is the 11th Plan’s new energy plus clean hydrogen/ammonia; self-generation is KEPCO’s purchases from commercial self-generators, which only KEEI’s total includes. Both predate the 12th re-forecast, so the 84.9TWh data-centre net increment is not in them.<\/p><div class=\"n2-chart n2-tall\" data-draw=\"gen-mix\" data-source=\"gen_mix\"><\/div><div class=\"n2-legend\" data-draw=\"gen-mix-legend\"><\/div><span class=\"n2-src\">MOTIE, 11th Basic Plan for Electricity Supply and Demand (2024–2038), revised notice 2025.3.13, p.51, p.53 · KEEI, Long-term Energy Outlook, reference scenario (REF) table A1-11 (file provided by the team)<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-gas\">Natural-gas imports and power-sector input<\/h3><p>PJ. CHP input includes heat production.<\/p><div class=\"n2-chart\" data-draw=\"gas\" data-source=\"gas_balance\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-m\"><\/i>Imports<\/span><span><i data-draw=\"sw-gas\"><\/i>Power only<\/span><span><i data-draw=\"sw-gas2\"><\/i>CHP<\/span><\/div><span class=\"n2-src\">KEEI, <a href=\"https://kesis.keei.re.kr/statHtml/statHtml.do?orgId=339&tblId=DT_BAL_SIMPLE_TJULE&conn_path=I3\" target=\"_blank\" rel=\"noopener\">National Energy Supply and Demand Statistics (simplified energy balance, TJ)<\/a> 2023–2025 (2024–2025 provisional)<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-subst\">When renewables replace LNG generation<\/h3><p>Fuel saving (tn KRW/yr). Assumes renewables replace LNG generation 1TWh for 1TWh for the 12th re-forecast’s data-centre '40 demand (net increment, total). Heat rate 1.734 Mcal/kWh, LNG 13.17 Gcal/t, fuel cost 124 KRW/kWh (all '25 KPX averages). Backup and grid costs not included.<\/p><div class=\"n2-chart\" data-draw=\"subst\" data-source=\"re_substitution\"><\/div><span class=\"n2-src\">Volume: slides of the 12th Plan 5th hearing, p.11 (<a href=\"https://naver.me/GGG5lbiF\" target=\"_blank\" rel=\"noopener\">download slides<\/a>) · heat rate, LNG heat content, fuel cost: KPX <a href=\"https://epsis.kpx.or.kr\" target=\"_blank\" rel=\"noopener\">EPSIS<\/a> fuel unit costs, 2025 monthly · imports and power input: <a href=\"https://kesis.keei.re.kr/statHtml/statHtml.do?orgId=339&tblId=DT_BAL_SIMPLE_TJULE&conn_path=I3\" target=\"_blank\" rel=\"noopener\">National Energy Supply and Demand Statistics (simplified energy balance)<\/a>, 2025 provisional<\/span><\/div>\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-routes\">Routes for an AIDC to buy clean power<\/h3><p>Judgement from statutory wording only. Actual terms (network charges, ancillary settlements, notice requirements) sit in ministerial notices and tariffs and are not assessed here.<\/p>\n        <div class=\"n2-tablebox\"><table class=\"n2-table\" data-source=\"ppa_routes\" data-row-key=\"route\"><thead><tr><th data-field=\"route\">Route<\/th><th data-field=\"legal_basis\">Basis<\/th><th data-field=\"what_it_allows\">What it allows<\/th><th data-field=\"constraint_in_text\">Constraint in text<\/th><th data-field=\"reading\">Reading<\/th><\/tr><\/thead><tbody data-draw=\"routes\"><\/tbody><\/table><\/div>\n        <span class=\"n2-src\"><a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A0%84%EA%B8%B0%EC%82%AC%EC%97%85%EB%B2%95\" target=\"_blank\" rel=\"noopener\">Electricity Business Act<\/a>·<a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A0%84%EA%B8%B0%EC%82%AC%EC%97%85%EB%B2%95%EC%8B%9C%ED%96%89%EB%A0%B9\" target=\"_blank\" rel=\"noopener\">Enforcement Decree<\/a>, summarised from the articles (Korea Law Information Center)<\/span><\/div>\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-ppa\">PPA and power-market provisions<\/h3><p>Source provisions for the route table: renewable electricity supply, power trading, direct purchase, contracts for difference. Statute text is shown in the Korean original.<\/p>\n        <div class=\"n2-tablebox\"><table class=\"n2-table\" data-source=\"ppa_clauses\" data-row-key=\"law,article\"><thead><tr><th data-field=\"law\">Law<\/th><th data-field=\"article\">Article<\/th><th data-field=\"title\">Title<\/th><th data-field=\"text\">Content<\/th><\/tr><\/thead><tbody data-draw=\"ppa\"><\/tbody><\/table><\/div>\n        <span class=\"n2-src\">Korea Law Information Center: <a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A0%84%EA%B8%B0%EC%82%AC%EC%97%85%EB%B2%95\" target=\"_blank\" rel=\"noopener\">Electricity Business Act<\/a>·<a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A0%84%EA%B8%B0%EC%82%AC%EC%97%85%EB%B2%95%EC%8B%9C%ED%96%89%EB%A0%B9\" target=\"_blank\" rel=\"noopener\">Enforcement Decree<\/a><\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <details>\n    <summary>Methods and limitations<\/summary>\n    <dl>\n      <dt>Data<\/dt><dd>Every figure is a result file computed in project DB clif-n2 and sessions S1–S5 from raw data that plug-ins loaded into the VOID base (clif-originals).<\/dd>\n      <dt>Licence→completion<\/dt><dd>v2 links 10 of the 11 KPX pipeline editions (’'22 Q4’s PDF text cannot be read) into 334 projects. Still listed in 2026 H1 = under way; left the list after its last listed completion date passed = finished (estimated); left before that = dropped. A finished project’s completion is its last listed date, not a confirmed commercial operation date, uncertain by the gap between editions (one year; two for ’'21Q4→'23 Q4). The listing threshold changed (over 40MW → 30MW and above → 20MW and above) and filing is voluntary, so a dropped project may have stopped filing rather than been cancelled. From ’'24 H2 the renewables lists print the latest (amended) licence date, so the earliest licence date in any edition is used. The ’'26 H1 chart below works as in v1: planned durations including planned completion dates. For central plants (Table 1) the licence date is the first licence on each project’s detail page, not the summary table (which sometimes gives an amended licence date, e.g. Daejeon CHP). Five LNG district-energy projects with licence→completion over 15 years (Suwon district energy, Daejeon CHP, Magok CHP, Songsan Bit Green, Yeosu Green Energy) sat on their licences for 14–39 years and are left out of the median. Merged cells inherit the source from the row above; 6 projects with no completion date are left out. Licence dates in the renewables table may be amended dates, which can shorten durations.<\/dd>\n      <dt>Fuel-cost sensitivity<\/dt><dd>Fuel cost = LNG price × exchange rate × 3.968 MMBtu/Gcal × heat rate. The heat rate is the '21–'26 median, 1.749 Mcal/kWh — a different period from the '25 average of 1.734 used in ⑤.<\/dd>\n      <dt>Carbon cost<\/dt><dd>Actual burden = KAU price × 390 gCO₂/kWh × the power sector’s auctioned share ('26 15%, '27 20%, '28 30%, '29 40%, '30 50%, Phase 4 final). The opportunity cost of free allowances and how KPX settlement passes carbon costs through are not included. In the settlement-price CSV, months with no solar or wind trade ('02~'04) show blank instead of 0; the '14 Jun solar settlement price (588 KRW/kWh) is KPX’s value as published.<\/dd>\n      <dt>Capacity factor and correlation<\/dt><dd>KPX hourly 'traded energy by fuel' data (the source does not state whether self-use and PPA are included). Wind is a single item with no onshore/offshore split. Solar includes evening discharge of co-located ESS (18:00–06:00 is 6.5% of the year).<\/dd>\n      <dt>Renewable substitution<\/dt><dd>Assumes 1TWh of renewables replaces 1TWh of LNG generation. The volume is the 12th re-forecast’s data-centre '40 demand (net 84.9TWh, total 100.6TWh). Heat rate 1.734 Mcal/kWh, LNG 13.17 Gcal/t and fuel cost 124 KRW/kWh come from KPX’s '25 fuel unit costs. The import share is over all natural-gas imports, city gas and industry included. Backup, storage and grid costs are not included.<\/dd>\n      <dt>12th Basic Plan<\/dt><dd>v2’s single outlook. Data-centre demand is the provisional figure (same in the base and high scenarios) on p.11 of the slides of the 12th Basic Plan demand re-forecast, 5th public hearing ('26.8.20). '40 total 100.6TWh / 14.2GW less the trend already in the model demand (15.7TWh / 2.3GW) leaves a net increment of 84.9TWh / 11.9GW, added as additional demand. The Ministry of Climate flagged a downward revision in '26 Oct, and the 12th Basic Plan is not final. The KEEI long-term outlook reference case predates the re-forecast and is kept for reference only.<\/dd>\n      <dt>PPA routes<\/dt><dd>Only the wording of the Electricity Business Act and Decree was read. Notices, tariffs and market rules were not checked. This is not legal advice.<\/dd>\n      <dt>Not covered<\/dt><dd>Official 12th Plan figures (unpublished), long-run cost of gas vs renewables+ESS, and scenario costs and emissions are left to the modelling stage.<\/dd>\n    <\/dl>\n  <\/details>\n<\/div>\n\n<script>\n(function () {\n  const N = {};\n  window.N2 = N;\n  // Fit every chart's SVG to everything it drew, so long labels (English ones especially) are never cut at the card edge.\n  const fit = (el) => el.querySelectorAll(':scope > svg').forEach((svg) => {\n    try {\n      const vb = svg.viewBox.baseVal; const bb = svg.getBBox(); if (!vb || !bb.width) return;\n      const x0 = Math.min(0, bb.x - 2), y0 = Math.min(0, bb.y - 2);\n      const x1 = Math.max(vb.width, bb.x + bb.width + 4), y1 = Math.max(vb.height, bb.y + bb.height + 2);\n      svg.setAttribute('viewBox', `${x0} ${y0} ${x1 - x0} ${y1 - y0}`); svg.setAttribute('height', y1 - y0);\n    } catch (e) { /* hidden or not yet laid out */ }\n  });\n  const _draw = dash.draw.bind(dash);\n  dash.draw = (name, fn) => _draw(name, (el) => { fn(el); fit(el); });\n  N.css = (name) => getComputedStyle(document.getElementById('dash-root') || document.documentElement).getPropertyValue(name).trim();\n  N.col = () => ({\n    a: dash.colors[0], b: dash.colors[1], c: dash.colors[2], d: dash.colors[3],\n    m: N.css('--cds-chart-muted') || '#aaa', fg: N.css('--color-fg') || '#222',\n    gas: dash.colors[3] || '#c0392b', solar: dash.colors[2] || '#e6a817', wind: dash.colors[0], nuc: dash.colors[4] || '#7d3c98', coal: N.css('--color-fg-muted') || '#666',\n    gas2: dash.colors[5] || '#e8a598'\n  });\n  N.rgb = (v, fallback) => {\n    const root = document.getElementById('dash-root') || document.body;\n    const p = document.createElement('span'); p.style.color = fallback || '#888'; p.style.color = v; p.style.display = 'none'; root.appendChild(p);\n    const out = getComputedStyle(p).color; p.remove();\n    return d3.color(out) ? out : (fallback || '#888');\n  };\n  N.ramp = (from, to) => d3.interpolateRgb(N.rgb(from, '#ffffff'), N.rgb(to, '#c0392b'));\n  N.num = (v) => (v === null || v === undefined || v === '' ? NaN : Number(v));\n  N.rows = (id) => { const d = dash.data(id); return d.status === 'ok' ? d.data : null; };\n  N.fail = (el, id) => {\n    const st = dash.data(id).status;\n    el.classList.toggle('dash-skeleton', st === 'loading');\n    if (st === 'error' || st === 'missing' || st === 'declined') { el.replaceChildren(); const f = document.createElement('div'); f.className = 'n2-fail'; f.textContent = 'Failed to load'; el.appendChild(f); return true; }\n    if (st !== 'ok') { el.replaceChildren(); return true; }\n    return false;\n  };\n  N.svg = (el, h, m) => {\n    el.replaceChildren();\n    const W = Math.max(280, el.clientWidth || 600);\n    const svg = d3.select(el).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${h}`).attr('height', h);\n    return { svg, W, h, m, iw: W - m.l - m.r, ih: h - m.t - m.b, g: svg.append('g').attr('transform', `translate(${m.l},${m.t})`) };\n  };\n  N.axis = (sel) => sel.attr('font-size', null).attr('font-family', null);\n  N.tip = (el) => {\n    const t = document.createElement('div'); t.className = 'n2-tip'; t.hidden = true; el.appendChild(t);\n    return {\n      show(lines, x, y) {\n        t.replaceChildren(...lines.map((s) => { const d = document.createElement('div'); d.textContent = s; return d; }));\n        t.hidden = false;\n        const W = el.clientWidth, tw = t.offsetWidth;\n        t.style.left = Math.min(Math.max(0, x + 12), Math.max(0, W - tw)) + 'px';\n        t.style.top = Math.max(0, y - 10) + 'px';\n      },\n      hide() { t.hidden = true; }\n    };\n  };\n  N.f1 = d3.format(',.1f'); N.f0 = d3.format(',.0f'); N.f2 = d3.format('.2f');\n  N.cell = (el, id, field, where, fmt) => {\n    if (dash.data(id).status !== 'ok') { el.textContent = '—'; return; }\n    const rows = dash.data(id).data;\n    const ri = el.dataset.row !== undefined ? Number(el.dataset.row) : null;\n    const r = ri !== null ? rows[ri] : where ? rows.find((x) => Object.entries(where).every(([k, v]) => String(x[k]) === String(v))) : rows[0];\n    el.textContent = r && r[field] !== undefined && r[field] !== null && r[field] !== '' ? fmt(r[field]) : '—';\n  };\n  N.dec = (x) => { try { return decodeURIComponent(x); } catch (e) { return x; } };\n  N.parseWhere = (s) => { if (!s) return null; const o = {}; s.split('&').forEach((p) => { const i = p.indexOf('='); o[N.dec(p.slice(0, i))] = N.dec(p.slice(i + 1)); }); return o; };\n})();\n<\/script>\n\n<script>\n// Tabs and links\n(function () {\n  const show = (id) => {\n    document.querySelectorAll('[data-sec]').forEach((s) => { s.hidden = s.dataset.sec !== id; });\n    document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === id)));\n  };\n  document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { show(b.dataset.tab); dash.setLink(b.dataset.tab); }));\n  const named = location.hash.slice(1);\n  if (['s1', 's2', 's3', 's4', 's5', 'sl'].includes(named)) show(named);\n})();\n<\/script>\n\n<script>\n// Calcs\ndash.calc('dc_supply_share', {\n  title: 'Share judged suppliable (\\'27)', description: '\\'27 cumulative suppliable ÷ applications',\n  inputs: ['dc_applications'],\n  fn: (dc_applications) => { const r = dc_applications.find((x) => String(x.year) === '2027'); return [{ share: Number(r.supply_feasible_mw_cum) / Number(r.applied_mw_cum) }]; }\n});\ndash.calc('dur_median', {\n  title: 'Licence→completion median', description: 'Median licence→(planned) completion (yr) and project count by source',\n  inputs: ['kpx_durations'],\n  fn: (kpx_durations) => {\n    const g = {};\n    kpx_durations.forEach((r) => { const v = Number(r.permit_to_completion_y); if (v >= 0 && String(r.median_excluded) !== '1') (g[r.tech] = g[r.tech] || []).push(v); });\n    return Object.entries(g).map(([tech, v]) => { v.sort((a, b) => a - b); const n = v.length; const med = n % 2 ? v[(n - 1) / 2] : (v[n / 2 - 1] + v[n / 2]) / 2; return { tech, median_y: Math.round(med * 10) / 10, n }; });\n  }\n});\ndash.calc('dur_permit_range', {\n  title: 'Licence dates by source', description: 'Earliest licence month of projects under way',\n  inputs: ['kpx_durations'],\n  fn: (kpx_durations) => { const g = {}; kpx_durations.forEach((r) => { if (r.permit && (!g[r.tech] || r.permit < g[r.tech])) g[r.tech] = r.permit; }); return Object.entries(g).map(([tech, first]) => ({ tech, first })); }\n});\ndash.calc('fuel_range', {\n  title: 'LNG fuel-cost range', description: '\\'11.1 onward: min, max, ratio and latest month of monthly LNG fuel cost',\n  inputs: ['fuel_monthly'],\n  fn: (fuel_monthly) => {\n    const v = fuel_monthly.filter((r) => r.month >= '2011-01' && r.lng_fuel !== '' && r.lng_fuel != null).map((r) => ({ m: r.month, x: Number(r.lng_fuel) }));\n    const lo = v.reduce((a, b) => (b.x < a.x ? b : a)); const hi = v.reduce((a, b) => (b.x > a.x ? b : a)); const last = v[v.length - 1];\n    return [{ min: lo.x, min_month: lo.m, max: hi.x, max_month: hi.m, ratio: hi.x / lo.x, latest: last.x, latest_month: last.m }];\n  }\n});\ndash.calc('gas_power_share', {\n  title: 'Natural-gas imports (PJ) and power+CHP share', description: 'Imports TJ ÷ 1,000 = PJ; (power only + CHP) ÷ imports; by year',\n  inputs: ['gas_balance'],\n  fn: (gas_balance) => gas_balance.map((r) => ({ year: r.year, import_pj: Number(r.import) / 1000, share: (Number(r.power_only) + Number(r.chp)) / Number(r.import) }))\n});\n<\/script>\n\n<script>\n// Numbers in text and tiles\n(function () {\n  const N = window.
