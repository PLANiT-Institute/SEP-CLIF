,2558431.8,781141.0,392917.3,1030523.1,200709.7\n", "re_substitution": "re_twh_replacing_lng,basis,lng_tj_avoided,lng_mt_avoided,share_of_2025_gas_import_pct,share_of_2025_power_chp_input_pct,fuel_cost_saving_trillion_krw_2025avg,heat_rate_mcal_per_kwh,lng_gcal_per_t,fuel_cost_krw_per_kwh_2025avg\n84.9,12차 재전망 DC '40 순증분,616313,11.18,24.1,52.5,10.54,1.734,13.17,124.2\n100.6,12차 재전망 DC '40 전체,730284,13.25,28.5,62.2,12.49,1.734,13.17,124.2\n", "ppa_clauses": "law,article,title,text\n전기사업법,제16조의5,재생에너지전기공급사업자 등의 전기공급,\"제16조의5(재생에너지전기공급사업자 등의 전기공급) ① ① 재생에너지전기공급사업자 및 재생에너지전기저장판매사업자는 재생에너지를 이용하여 생산한 전기를 전력시장을 거치지 아니하고 전기사용자에게 공급할 수 있다. <개정 2023.10.31> ② ② 송전제약발생지역전기공급사업자는 다음 각 호의 요건을 갖춘 경우에 생산한 전기를 전력시장을 거치지 아니하고 전기사용자에게 공급할 수 있다. 이 경우 송전제약발생지역전기공급사업자의 전기 공급에 관한 세부사항은 기후에너지환경부장관이 정하여 고시한다. <신설 2024.2.6, 2025.10.1> 1. 1. 송전제약으로 발전설비의 최적 활용이 곤란한 지역에 위치한 발전설비를 이용하여 생산한 전기를 공급할 것 2. 2. 전기사용자의 수전설비가 발전설비 인접지역에 위치하고 신규 시설일 것 ③ ③ 전기자동차충전사업자는 대통령령으로 정하는 범위에서 재생에너지를 이용하여 생산한 전기를 전력시장을 거치지 아니하고 전기자동차에 공급할 수 있다. <신설 2023.10.31, 2024.2.6> ④ ④ 제1항 및 제2항에 따라 재생에너지전기공급사업자, 재생에너지전기저장판매사업자 및 송전제약발생지역전기공급사업자가 전기사용자에게 전기를 공급하는 경우 요금과 그 밖의 공급조건 등을 개별적으로 협의하여 계약할 수 있다. <개정 2023.10.31, 2024.2.6> ⑤ 개정 2023.10.31, 2024.2.6, 2026.3.17 ⑤ 제1항부터 제3항까지에 따라 공급되는 전기는 「재생에너지 개발ㆍ이용ㆍ보급 촉진법」 제12조의7제1항에 따른 재생에너지 공급인증서의 발급대상이 되지 아니한다. <개정 2023.10.31, 2024.2.6, 2026.3.17> ⑥ ⑥ 그 밖에 제1항부터 제3항까지에 따른 전기공급에 필요한 사항은 기후에너지환경부령으로 정한다. <개정 2023.10.31, 2024.2.6, 2025.10.1>\"\n전기사업법,제31조,전력거래,\"제31조(전력거래) ① ① 발전사업자 및 전기판매사업자는 제43조에 따른 전력시장운영규칙으로 정하는 바에 따라 전력시장에서 전력거래를 하여야 한다. 다만, 도서지역 등 대통령령으로 정하는 경우에는 그러하지 아니하다. ② ② 자가용전기설비를 설치한 자는 그가 생산한 전력을 전력시장에서 거래할 수 없다. 다만, 대통령령으로 정하는 경우에는 그러하지 아니하다. ③ ③ 구역전기사업자는 대통령령으로 정하는 바에 따라 특정한 공급구역의 수요에 부족하거나 남는 전력을 전력시장에서 거래할 수 있다. ④ 개정 2013.7.30, 2026.3.17 ④ 전기판매사업자는 다음 각 호의 어느 하나에 해당하는 자가 생산한 전력을 제43조에 따른 전력시장운영규칙으로 정하는 바에 따라 우선적으로 구매할 수 있다. <개정 2013.7.30, 2026.3.17> 1. 1. 대통령령으로 정하는 규모 이하의 발전사업자 2. 2. 자가용전기설비를 설치한 자(제2항 단서에 따라 전력거래를 하는 경우만 해당한다) 3. 3. 「재생에너지 개발ㆍ이용ㆍ보급 촉진법」 제2조제2호에 따른 재생에너지와 「수소경제 육성 및 수소 안전관리에 관한 법률」 제2조제6호 및 제11호에 따른 연료전지등에 활용되는 에너지 및 수소에너지를 이용하여 전기를 생산하는 발전사업자 4. 4. 「집단에너지사업법」 제48조에 따라 발전사업의 허가를 받은 것으로 보는 집단에너지사업자 5. 5. 수력발전소를 운영하는 발전사업자 ⑤ ⑤ 「지능형전력망의 구축 및 이용촉진에 관한 법률」 제12조제1항에 따라 지능형전력망 서비스 제공사업자로 등록한 자 중 대통령령으로 정하는 자(이하 \"\"수요관리사업자\"\"라 한다)는 제43조에 따른 전력시장운영규칙으로 정하는 바에 따라 전력시장에서 전력거래를 할 수 있다. 다만, 수요관리사업자 중 「독점규제 및 공정거래에 관한 법률」 제31조제1항의 상호출자제한기업집단에 속하는 자가 전력거래를 하는 경우에는 대통령령으로 정하는 전력거래량의 비율에 관한 기준을 충족하여야 한다. <신설 2014.5.20, 2020.12.29> ⑥ ⑥ 소규모전력중개사업자는 모집한 소규모전력자원에서 생산 또는 저장한 전력을 제43조에 따른 전력시장운영규칙으로 정하는 바에 따라 전력시장에서 거래하여야 한다. <신설 2018.6.12> ⑦ ⑦ 통합발전소사업자는 제43조에 따른 전력시장운영규칙에서 정하는 바에 따라 통합발전소에서 생산 또는 저장한 전력을 전력시장에서 거래할 수 있다. <신설 2023.6.13>\"\n전기사업법,제32조,전력의 직접 구매,\"제32조(전력의 직접 구매) 전기사용자는 전력시장에서 전력을 직접 구매할 수 없다. 다만, 대통령령으로 정하는 규모 이상의 전기사용자는 그러하지 아니하다.\"\n전기사업법,제34조,차액계약,\"제34조(차액계약) ① ①발전사업자는 전력구매자(전기판매사업자, 제31조제3항에 따라 전력을 구매하는 구역전기사업자 또는 제32조 단서에 따라 전력을 직접 구매하는 전기사용자를 말한다. 이하 이 조에서 같다)와 전력거래가격의 변동으로 인하여 발생하는 위험을 줄이기 위하여 일정한 기준가격을 설정하고 그 기준가격과 전력거래가격 간의 차액 보전(補塡)에 관한 것을 내용으로 하는 계약(이하 \"\"차액계약\"\"이라 한다)을 체결할 수 있다. <개정 2014.5.20> ② ② 전력수급의 안정을 도모하고 전기사용자의 이익을 보호하기 위하여 대통령령으로 정하는 기준에 해당하는 발전사업자와 전력구매자는 기후에너지환경부장관이 정하여 고시하는 전력량에 대해서는 차액계약을 통하여서만 전력을 거래하여야 한다. 다만, 차액계약의 체결로 인하여 「댐건설ㆍ관리 및 주변지역지원 등에 관한 법률」 제44조제2항제1호에 따른 출연금이 감소하는 경우 전력구매자는 대통령령으로 정하는 바에 따라 감소한 출연금을 보전하여야 한다. <신설 2014.5.20, 2021.6.15, 2025.10.1> ③ ③ 제2항에 따라 차액계약을 체결한 발전사업자와 전력구매자는 대통령령으로 정하는 바에 따라 차액계약의 내용에 대하여 공동으로 기후에너지환경부장관의 인가를 받아야 한다. 이를 변경하려는 경우에도 또한 같다. <신설 2014.5.20, 2025.10.1> ④ ④ 기후에너지환경부장관은 제3항에 따른 인가를 하려는 경우에는 전기위원회의 심의를 거쳐야 한다. 다만, 대통령령으로 정하는 경미한 사항의 경우에는 전기위원회의 심의를 생략할 수 있다. <신설 2014.5.20, 2025.10.1>\"\n전기사업법 시행령,제19조,전력거래,\"제19조(전력거래) ① 개정 2021.1.12, 2021.10.19, 2023.3.21, 2024.4.30, 2025.7.29, 2025.10.1, 2026.8.18 ① 법 제31조제1항 단서에서 \"\"도서지역 등 대통령령으로 정하는 경우\"\"란 다음 각 호의 경우를 말한다. <개정 2021.1.12, 2021.10.19, 2023.3.21, 2024.4.30, 2025.7.29, 2025.10.1, 2026.8.18> 1. 1. 한국전력거래소가 운영하는 전력계통에 연결되어 있지 아니한 도서지역에서 전력을 거래하는 경우 2. 2. 「재생에너지 개발ㆍ이용ㆍ보급 촉진법」 제2조제5호에 따른 재생에너지 발전사업자(이하 \"\"재생에너지발전사업자\"\"라 한다) 또는 「수소경제 육성 및 수소 안전관리에 관한 법률」 제2조제7호의4에 따른 수소발전사업자(이하 \"\"수소발전사업자\"\"라 한다)가 발전설비용량이 1천킬로와트 이하인 발전설비를 이용하여 생산한 전력을 거래하는 경우 3. 3. 기후에너지환경부장관이 정하여 고시하는 요건을 갖춘 재생에너지발전사업자(자가용전기설비를 설치한 자는 제외한다. 이 호 및 제4호에서 같다) 또는 수소발전사업자(자가용전기설비를 설치한 자는 제외한다. 이 호 및 제4호에서 같다)가 발전설비용량(둘 이상의 재생에너지발전사업자 또는 수소발전사업자가 공동으로 공급하는 경우에는 그 발전설비용량을 합산한다. 이하 제4호에서 같다)이 1천킬로와트를 초과하는 발전설비를 이용하여 생산한 전력을 전기판매사업자에게 공급하고, 전기판매사업자가 그 전력을 기후에너지환경부장관이 정하여 고시하는 요건을 갖춘 전기사용자에게 공급하는 방법으로 전력을 거래하는 경우 4. 4. 기후에너지환경부장관이 정하여 고시하는 요건을 갖춘 재생에너지발전사업자 또는 수소발전사업자가 발전설비를 이용하여 생산한 전력을 재생에너지전기공급사업자에게 공급하는 경우로서 다음 각 목의 어느 하나에 해당하는 경우 가. 가. 발전설비용량이 1천킬로와트를 초과하는 발전설비를 이용하여 생산한 전력을 공급하는 경우 나. 나. 발전설비용량이 1천킬로와트 이하인 발전설비를 이용하여 생산한 전력을 송전용 또는 배전용 전기설비 없이 공급하는 경우 5. 5. 「수소경제 육성 및 수소 안전관리에 관한 법률」 제2조제7호의4에 따른 수소발전사업자가 생산한 전력을 같은 법 제25조의6제2항에 따른 수소발전 입찰시장에서 거래하는 경우 6. 6. 기후에너지환경부장관이 정하여 고시하는 요건을 갖춘 재생에너지발전사업자가 발전설비용량이 1천킬로와트(송전용 또는 배전용 전기설비 없이 공급하는 경우에는 5백킬로와트)를 초과하는 발전설비를 이용하여 생산한 전력을 재생에너지전기저장판매사업자에게 공급하는 경우 7. 7. 기후에너지환경부장관이 정하여 고시하는 요건을 갖춘 재생에너지발전사업자가 발전설비를 이용하여 생산한 전력을 전기자동차충전사업자에게 공급하는 경우 ② ② 법 제31조제2항 단서에서 \"\"대통령령으로 정하는 경우\"\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2017.3.2, 2021.3.30, 2025.1.7> 1. 1. 태양광 설비를 설치한 자가 해당 설비를 통하여 생산한 전력 중 자기가 사용하고 남은 전력을 거래하는 경우 2. 2. 태양광 설비 외의 설비(석탄을 에너지원으로 이용하는 설비는 2017년 2월 28일까지 「전기안전관리법」 제8조제1항 전단 또는 같은 조 제2항 전단에 따른 설치공사ㆍ변경공사의 공사계획의 인가 신청 또는 신고를 한 경우로 한정한다)를 설치한 자가 해당 설비를 통하여 생산한 전력의 연간 총생산량의 30퍼센트 미만의 범위에서 전력을 거래하는 경우 ③ ③ 법 제31조제1항 및 제2항에 따른 발전사업자, 전기판매사업자, 전기사용자 및 자가용전기설비를 설치한 자 간의 전력거래 절차와 그 밖에 필요한 사항은 기후에너지환경부장관이 정하여 고시한다. <개정 2013.3.23, 2021.1.12, 2025.10.1> ④ ④ 법 제31조제3항에 따라 구역전기사업자는 다음 각 호의 어느 하나에 해당하는 전력을 전력시장에서 거래할 수 있다. <개정 2013.3.23, 2023.3.21, 2025.10.1> 1. 1. 허가받은 공급능력으로 해당 특정한 공급구역의 수요에 부족하거나 남는 전력 2. 2. 발전기의 고장, 정기점검 및 보수 등으로 인하여 해당 특정한 공급구역의 수요에 부족한 전력 3. 3. 제59조의2에 해당하는 자가 기후에너지환경부령으로 정하는 기간 동안 해당 특정한 공급구역의 열 수요가 감소함에 따라 발전기 가동을 단축하는 경우 생산한 전력으로는 해당 특정한 공급구역의 수요에 부족한 전력 ⑤ ⑤ 법 제31조제4항제1호에서 \"\"대통령령으로 정하는 규모 이하의 발전사업자\"\"란 설비용량이 2만킬로와트 이하인 발전사업자를 말한다. ⑥ ⑥ 법 제31조제5항 본문에서 \"\"대통령령으로 정하는 자\"\"란 「지능형전력망의 구축 및 이용촉진에 관한 법률 시행령」 별표 1에 따른 수요반응관리서비스제공사업자(이하 \"\"수요관리사업자\"\"라 한다)를 말한다. <신설 2014.11.19> ⑦ ⑦ 「독점규제 및 공정거래에 관한 법률」 제9조제1항에 따른 상호출자제한기업집단(이하 이 항에서 \"\"기업집단\"\"이라 한다)에 속하는 수요관리사업자가 법 제31조제5항 본문에 따라 전력거래를 하는 경우에는 제1호 및 제2호를 합한 전력거래량에서 제1호의 전력거래량이 차지하는 비율이 100분의 30을 넘어서는 아니 된다. <신설 2014.11.19> 1. 1. 해당 수요관리사업자가 속하는 기업집단 내부의 전력소비자(해당 수요관리사업자는 제외한다)의 전력소비감축(법 제45조제1항에 따라 한국전력거래소가 전력계통의 운영을 위하여 수요관리사업자에게 하는 전력소비 감축의 지시에 따라 감축하는 것을 말한다. 이하 같다)을 통하여 확보한 전력거래량 2. 2. 해당 수요관리사업자가 속하는 기업집단 외부의 전력소비자의 전력소비감축을 통하여 확보한 전력거래량\"\n전기사업법 시행령,제20조,전력의 직접 구매,\"제20조(전력의 직접 구매) 법 제32조 단서에서 \"\"대통령령으로 정하는 규모 이상의 전기사용자\"\"란 수전설비(受電設備)의 용량(재생에너지전기공급사업자로부터 전기를 공급받는 경우에는 기후에너지환경부장관이 정하여 고시하는 바에 따라 각 수전설비를 합산한 용량을 말한다)이 3만킬로볼트암페어 이상인 전기사용자를 말한다. <개정 2021.10.19, 2025.10.1>\"\n전기사업법 시행령,제20조의2,차액계약의 적용 대상,\"제20조의2(차액계약의 적용 대상) 법 제34조제2항 본문에서 \"\"대통령령으로 정하는 기준에 해당하는 발전사업자와 전력구매자\"\"란 다음 각 호의 구분에 따른 발전사업자와 전력구매자를 말한다. <개정 2025.10.1> 1. 1. 발전사업자: 다음 각 목의 요건을 모두 갖춘 발전사업자 가. 가. 기후에너지환경부장관이 정하여 고시하는 저원가 발전원(發電源)을 사용할 것 나. 나. 발전설비용량이 2만킬로와트를 초과하는 발전기를 보유할 것 2. 2. 전력구매자: 다음 각 목의 어느 하나에 해당하는 전력구매자 가. 가. 전기판매사업자 나. 나. 법 제31조제3항에 따라 전력을 구매하는 구역전기사업자 중 이 영 제19조제4항제3호의 전력을 구매하는 구역전기사업자 다. 다. 법 제32조 단서 및 이 영 제20조에 따라 전력을 직접 구매하는 전기사용자\"\n전기사업법 시행령,제20조의4,차액계약의 인가,\"제20조의4(차액계약의 인가) ① ① 발전사업자와 전력구매자가 법 제34조제2항 본문에 따라 체결하는 차액계약에는 다음 각 호의 사항이 포함되어야 한다. 1. 1. 계약의 당사자 2. 2. 계약의 내용에 관한 다음 각 목의 사항 가. 가. 기준가격 나. 나. 차액계약 대상 발전기 다. 다. 계약전력량 라. 라. 계약기간 3. 3. 계약당사자의 권리ㆍ의무에 관한 사항 4. 4. 정산 방법 및 절차 ② ② 법 제34조제3항 전단에 따라 기후에너지환경부장관의 인가를 받으려는 발전사업자 및 전력구매자는 기후에너지환경부령으로 정하는 인가신청서에 제1항 각 호의 내용을 증명할 수 있는 서류를 첨부하여 해당 계약이 개시되기 3개월 전까지 기후에너지환경부장관에게 인가를 공동으로 신청하여야 한다. 다만, 해당 계약기간 개시 3개월 전까지 인가신청서를 제출하기 어려운 특별한 사유가 있다고 기후에너지환경부장관이 인정하는 경우에는 1회에 한정하여 신청기한을 1개월 연장할 수 있다. <개정 2025.10.1> ③ ③ 법 제34조제3항 후단에 따라 변경인가를 신청하려는 발전사업자 및 전력구매자는 기후에너지환경부령으로 정하는 변경인가신청서에 변경 내용을 증명할 수 있는 서류를 첨부하여 변경사유가 발생한 날부터 1개월 이내에 변경인가를 공동으로 신청하여야 한다. <개정 2025.10.1> ④ ④ 기후에너지환경부장관은 제2항에 따라 인가의 신청을 받은 경우 해당 계약기간의 개시 g); border-color: var(--color-border-line); background: var(--color-panel); }\n.n2-tab:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }\n.n2-sec { display: grid; gap: var(--cds-gap-md); }\n.n2-sec[hidden] { display: none; }\n.n2-q { margin: 0; font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); text-wrap: balance; }\n.n2-claim { margin: 0; color: var(--color-fg-muted); max-width: 72ch; }\n.n2-claim b, .n2-tile b { font-weight: 600; color: var(--color-fg); }\n.n2-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: var(--cds-gap-md); }\n.n2-tile { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-md); display: grid; gap: var(--cds-gap-xs); align-content: start; }\n.n2-tile-label { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }\n.n2-tile-value { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); font-variant-numeric: tabular-nums; line-height: 1.1; }\n.n2-unit { font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body); color: var(--color-fg-muted); margin-left: 0.15em; }\n.n2-tile-note { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }\n.n2-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--cds-gap-md); }\n.n2-grid > .n2-card { grid-column: span 3; }\n.n2-grid > .n2-card-third { grid-column: span 2; }\n@media (max-width: 60rem) { .n2-grid > .n2-card, .n2-grid > .n2-card-third { grid-column: 1 / -1; } }\n.n2-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); display: grid; gap: var(--cds-gap-sm); min-width: 0; align-content: start; }\n.n2-grid > .n2-card-wide { grid-column: 1 / -1; }\n.n2-card h3 { margin: 0; font-size: var(--cds-font-size-hea -weight-medium); padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); }\n.n2-table td { padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); vertical-align: top; }\n.n2-table td:last-child { color: var(--color-fg-muted); max-width: 70ch; white-space: pre-wrap; }\n.n2 details { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }\n.n2 details summary { cursor: pointer; color: var(--color-fg); }\n.n2 dl { display: grid; grid-template-columns: minmax(8rem, max-content) 1fr; gap: var(--cds-gap-xs) var(--cds-gap-md); margin: var(--cds-gap-sm) 0 0; }\n.n2 dt { color: var(--color-fg); }\n.n2 dd { margin: 0; }\n.n2-filter { display: flex; flex-wrap: wrap; gap: var(--cds-gap-xs); }\n.n2-filter button { font: inherit; font-size: var(--cds-font-size-caption); background: none; border: 1px solid var(--color-border-line); border-radius: 999px; padding: 2px 10px; color: var(--color-fg-muted); cursor: pointer; }\n.n2-filter button[aria-pressed=\"true\"] { color: var(--color-fg); border-color: var(--color-fg); }\n.n2-dbdet { margin-top: var(--cds-gap-md); }\n.n2-dbdet > summary { font-size: var(--cds-font-size-body); margin-bottom: var(--cds-gap-sm); }\n.n2-sl td:nth-child(7) { max-width: 28ch; }\n.n2-db td:nth-child(7) { white-space: nowrap; font-weight: var(--cds-font-weight-medium); }\n.n2-db td:last-child { color: var(--color-fg); }\n.n2-sl td:nth-child(5) { white-space: nowrap; font-weight: var(--cds-font-weight-medium); }\n.n2-sl td:last-child { color: var(--color-fg); }\n.n2-sl td:nth-child(3), .n2-sl td:nth-child(4) { color: var(--color-fg-muted); max-width: 22ch; }\n.n2-badge { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 2px; margin-right: 0.35em; vertical-align: baseline; }\n[data-dash-source-state=empty] { color: transparent; }\n[data-dash-source-state=refreshing] { opacity: .5; transition: opacity var(--cds-dur-slow); }\n.n2-src a, .n2-table a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }\n<\/style>\n\n<div class=\"n2\">\n  <header class=\"n2-head\">\n    <h1 class=\"n2-title\">AI 데이터센터 전력, 재생에너지의 장점은?<\/h1>\n    <p class=\"n2-lede\">요청서 스토리라인 ①~⑤를 VOID 세션(S1~S5)의 결과로 보여 줍니다. 수요는 빨리 늘고, 가스는 짓는 데 오래 걸리고 연료비가 흔들리며, 태양광과 풍력은 섞으면 시간 단위 변동이 줄어듭니다. v2는 미래 수요를 12차 전력수급기본계획 전력수요 재전망(5차 공청회 '26.8.20, 잠정안) 하나로 맞췄습니다.<\/p>\n  <\/header>\n\n  <nav class=\"n2-tabs\" role=\"tablist\" aria-label=\"스토리라인 단계\">\n    <button class=\"n2-tab\" role=\"tab\" id=\"tab-s1\" data-tab=\"s1\" aria-selected=\"true\">① 전력이 병목<\/button>\n    <button class=\"n2-tab\" role=\"tab\" id=\"tab-s2\" data-tab=\"s2\" aria-selected=\"false\">② 가스는 빠른가<\/button>\n    <button class=\"n2-tab\" role=\"tab\" id=\"tab-s3\" data-tab=\"s3\" aria-selected=\"false\">③ 가스의 숨은 비용<\/button>\n    <button class=\"n2-tab\" role=\"tab\" id=\"tab-s4\" data-tab=\"s4\" aria-selected=\"false\">④ 재생 포트폴리오<\/button>\n    <button class=\"n2-tab\" role=\"tab\" id=\"tab-s5\" data-tab=\"s5\" aria-selected=\"false\">⑤ 청정전력 전략<\/button>\n  <\/nav>\n\n  <!-- ① -->\n  <section class=\"n2-sec\" id=\"s1\" data-sec=\"s1\" role=\"tabpanel\" aria-labelledby=\"tab-s1\">\n    <h2 class=\"n2-q\">AI 산업의 새로운 병목은 전력이다<\/h2>\n    <p class=\"n2-claim\">12차 전기본 재전망(5차 공청회, 잠정안)은 데이터센터 전력소비를 '40년 <b data-draw=\"s1-twh\" data-source=\"dc_demand\" data-field=\"total_twh\" data-where=\"plan=12th_redraft\">—<\/b>TWh로 봅니다. 11차 전기본('38년 <b data-draw=\"s1-twh11\" data-source=\"dc_demand\" data-field=\"total_twh\" data-where=\"year=2038\">—<\/b>TWh)의 3배가 넘습니다. 그런데 한전 검토('23.8월 기준)로는 전기사용신청 중 '27년까지 공급가능 판정을 받은 것이 <b data-draw=\"s1-share\" data-source=\"dc_supply_share\" data-field=\"share\">—<\/b>뿐이었습니다.<\/p>\n    <div class=\"n2-tiles\">\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">데이터센터 전력소비 '40<\/span><span class=\"n2-tile-value\"><span data-draw=\"s1-t1\" data-source=\"dc_demand\" data-field=\"total_twh\" data-where=\"plan=12th_redraft\">—<\/span><span class=\"n2-unit\">TWh<\/span><\/span><span class=\"n2-tile-note\">12차 재전망. 추세 제외 순증분 <span data-draw=\"s1-t1b\" data-source=\"dc_demand\" data-field=\"increment_twh\" data-where=\"plan=12th_redraft\">—<\/span>TWh<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">최대전력 '40<\/span><span class=\"n2-tile-value\"><span data-draw=\"s1-t2\" data-source=\"dc_demand\" data-field=\"total_gw\" data-where=\"plan=12th_redraft\">—<\/span><span class=\"n2-unit\">GW<\/span><\/span><span class=\"n2-tile-note\">11차 '38 <span data-draw=\"s1-t2b\" data-source=\"dc_demand\" data-field=\"total_gw\" data-where=\"year=2038\">—<\/span>GW<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">전기사용신청 '27 누적<\/span><span class=\"n2-tile-value\"><span data-draw=\"s1-t3\" data-source=\"dc_applications\" data-field=\"applied_mw_cum\" data-where=\"year=2027\">—<\/span><span class=\"n2-unit\">MW<\/span><\/span><span class=\"n2-tile-note\">계약전력, '23.8월 기준<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">공급가능 판정 못 받은 물량<\/span><span class=\"n2-tile-value\"><span data-draw=\"s1-t4\" data-source=\"dc_applications\" data-field=\"gap_mw\" data-where=\"year=2027\">—<\/span><span class=\"n2-unit\">MW<\/span><\/span><span class=\"n2-tile-note\">'27까지, '23.8월 기준<\/span><\/div>\n    <\/div>\n    <div class=\"n2-grid\">\n      <div class=\"n2-card\"><h3 id=\"c-dc-demand\">데이터센터 전력수요 전망<\/h3><p>막대는 전력소비량(TWh), 점은 최대전력(GW). '23은 실적, '25~'38은 11차 전기본, '40은 12차 전기본의 당초('26.4)와 재전망('26.8, 잠정). 12차 증분은 추세를 뺀 순증분, 11차 증분은 추세 대비 증분(추가수요).<\/p><div class=\"n2-chart\" data-draw=\"dc-demand\" data-source=\"dc_demand\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-m\"><\/i>실적<\/span><span><i data-draw=\"sw-a\"><\/i>11차 전기본<\/span><span><i data-draw=\"sw-gas2\"><\/i>12차 당초<\/span><span><i data-draw=\"sw-gas\"><\/i>12차 재전망<\/span><span><i data-draw=\"sw-b\"><\/i>최대전력<\/span><\/div><span class=\"n2-src\">산업통상자원부, 「제11차 전력수급기본계획(2024~2038)」 2025.3.13 수정공고, 참고6 p.22 · 기후에너지환경부·제12차 전기본 총괄위원회, 「전력수요 재전망(5차) 대국민 정책토론회」 발표자료 p.11 (2026.8.20, <a href=\"https://www.youtube.com/watch?v=egfHkMqV-HA\" target=\"_blank\" rel=\"noopener\">토론회 영상<\/a>, <a href=\"https://naver.me/GGG5lbiF\" target=\"_blank\" rel=\"noopener\">발표자료 내려받기<\/a>)<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-dc-app\">전기사용신청 대비 공급가능 판정<\/h3><p>한전 검토 결과, 누적 계약전력. '23.8월 기준.<\/p><div class=\"n2-chart\" data-draw=\"dc-app\" data-source=\"dc_applications\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-m\"><\/i>전기사용신청<\/span><span><i data-draw=\"sw-a\"><\/i>공급가능<\/span><\/div><span class=\"n2-src\">산업통상자원부, 「제11차 전력수급기본계획(2024~2038)」 2025.3.13 수정공고, 참고6 p.21 (한전 검토, 2023.8월 기준)<\/span><\/div>\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-aidc-tl\">AIDC 전력 전망과 병목 신호, 11차 → 12차 수립 중<\/h3><p>12차 전기본은 아직 확정 전입니다. '공식' 행은 정부 문서와 공청회 발표자료, '기사' 행은 보도된 값입니다. 공청회의 데이터센터 '40년 순증분 11.9GW는 '26.10월 하향 조정이 예고되었습니다.<\/p>\n        <div class=\"n2-tablebox\"><table class=\"n2-table\" data-source=\"aidc_timeline\" data-row-key=\"date,statement\"><thead><tr><th data-field=\"date\">날짜<\/th><th data-field=\"stream\">구분<\/th><th data-field=\"kind\">근거<\/th><th data-field=\"statement\">내용<\/th><th data-field=\"url\">원문<\/th><\/tr><\/thead><tbody data-draw=\"aidc-tl\"><\/tbody><\/table><\/div>\n        <span class=\"n2-src\">정부 자료: 「제11차 전력수급기본계획」 · 과기정통부 보도자료 <a href=\"https://www.korea.kr/briefing/pressReleaseView.do?newsId=156760349\" target=\"_blank\" rel=\"noopener\">「인공지능 데이터센터 특별법 국회 본회의 통과」<\/a> (2026.5.7) · 12차 전기본 4·5차 토론회 발표자료 (2026.8.20, <a href=\"https://naver.me/GGG5lbiF\" target=\"_blank\" rel=\"noopener\">발표자료 내려받기<\/a>) · 과기정통부·기후부 보도자료 <a href=\"https://www.korea.kr/briefing/pressReleaseView.do?newsId=156790061\" target=\"_blank\" rel=\"noopener\">「AI 데이터센터 신속 구축을 위한 전력계통영향평가 제도 개선 추진」<\/a> (2026.11.20). 기사 행은 표의 원문 링크.<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ② -->\n  <section class=\"n2-sec\" id=\"s2\" data-sec=\"s2\" role=\"tabpanel\" aria-labelledby=\"tab-s2\" hidden>\n    <h2 class=\"n2-q\">가스발전이 빠른 해법일까<\/h2>\n    <p class=\"n2-claim\">KPX 추진현황 10개 회차를 이어 실제로 끝난 사업만 보면, 발전사업 허가부터 준공까지 중앙값은 태양광 <b data-draw=\"s2-c1\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=태양광&amp;status=completed_est\">—<\/b>년, LNG 복합 <b data-draw=\"s2-c2\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=LNG 복합&amp;status=completed_est\">—<\/b>년, 육상풍력 <b data-draw=\"s2-c7\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=육상풍력&amp;status=completed_est\">—<\/b>년입니다. 아직 짓고 있는 사업은 최초 허가부터 태양광 <b data-draw=\"s2-c8\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=태양광&amp;status=in_progress\">—<\/b>년, LNG 복합 <b data-draw=\"s2-c9\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=LNG 복합&amp;status=in_progress\">—<\/b>년이 지났거나 걸릴 예정입니다. 해상풍력은 허가된 <b data-draw=\"s2-c3\" data-source=\"kpx_permitted\" data-field=\"permitted_mw\" data-where=\"tech=해상풍력\">—<\/b>MW 중 일정이 제출된 것이 <b data-draw=\"s2-c4\" data-source=\"kpx_permitted\" data-field=\"submitted_mw\" data-where=\"tech=해상풍력\">—<\/b>MW뿐입니다.<\/p>\n    <div class=\"n2-tiles\">\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">태양광 허가→준공<\/span><span class=\"n2-tile-value\"><span data-draw=\"s2-t1\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=태양광&amp;status=completed_est\">—<\/span><span class=\"n2-unit\">년<\/span><\/span><span class=\"n2-tile-note\">끝난 사업 <span data-draw=\"s2-n1\" data-source=\"dur_cross\" data-field=\"n_with_span\" data-where=\"subset=all&amp;tech=태양광&amp;status=completed_est\">—<\/span>건. 진행 중 <span data-draw=\"s2-p1\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=태양광&amp;status=in_progress\">—<\/span>년<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">육상풍력<\/span><span class=\"n2-tile-value\"><span data-draw=\"s2-t2\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=육상풍력&amp;status=completed_est\">—<\/span><span class=\"n2-unit\">년<\/span><\/span><span class=\"n2-tile-note\">끝난 사업 <span data-draw=\"s2-n2\" data-source=\"dur_cross\" data-field=\"n_with_span\" data-where=\"subset=all&amp;tech=육상풍력&amp;status=completed_est\">—<\/span>건. 진행 중 <span data-draw=\"s2-p2\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=육상풍력&amp;status=in_progress\">—<\/span>년<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">LNG 복합<\/span><span class=\"n2-tile-value\"><span data-draw=\"s2-t3\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=LNG 복합&amp;status=completed_est\">—<\/span><span class=\"n2-unit\">년<\/span><\/span><span class=\"n2-tile-note\">끝난 사업 <span data-draw=\"s2-n3\" data-source=\"dur_cross\" data-field=\"n_with_span\" data-where=\"subset=all&amp;tech=LNG 복합&amp;status=completed_est\">—<\/span>건. 진행 중 <span data-draw=\"s2-p3\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=LNG 복합&amp;status=in_progress\">—<\/span>년<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">해상풍력<\/span><span class=\"n2-tile-value\"><span data-draw=\"s2-t4\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=해상풍력&amp;status=completed_est\">—<\/span><span class=\"n2-unit\">년<\/span><\/span><span class=\"n2-tile-note\">끝난 사업 <span data-draw=\"s2-n4\" data-source=\"dur_cross\" data-field=\"n_with_span\" data-where=\"subset=all&amp;tech=해상풍력&amp;status=completed_est\">—<\/span>건. 진행 중 <span data-draw=\"s2-p4\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=해상풍력&amp;status=in_progress\">—<\/span>년<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">원자력<\/span><span class=\"n2-tile-value\"><span data-draw=\"s2-t5\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=원자력&amp;status=completed_est\">—<\/span><span class=\"n2-unit\">년<\/span><\/span><span class=\"n2-tile-note\">끝난 사업 <span data-draw=\"s2-n5\" data-source=\"dur_cross\" data-field=\"n_with_span\" data-where=\"subset=all&amp;tech=원자력&amp;status=completed_est\">—<\/span>건. 진행 중 <span data-draw=\"s2-p5\" data-source=\"dur_cross\" data-field=\"median_y\" data-where=\"subset=all&amp;tech=원자력&amp;status=in_progress\">—<\/span>년<\/span><\/div>\n    <\/div>\n    <div class=\"n2-grid\">\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-dur-cross\">끝난 사업과 진행 중 사업의 허가 → 준공 기간<\/h3><p>년, 중앙값. 막대 끝 괄호는 사업 수. 끝난 사업은 KPX 추진현황 회차('16Q4~'26H1)를 이어, 목록에서 빠지기 직전에 실린 준공 예정일을 준공으로 봤습니다(KPX 건설완료 표와 맞춰 볼 수 있는 25건은 −5~+2개월 차이). 허가일은 어느 회차에서든 가장 이른 날짜입니다. 끝난 사업은 빨리 끝난 쪽으로, 진행 중 사업은 오래 걸리는 쪽으로 치우칩니다. 해상풍력·연료전지·바이오·원자력의 끝난 사업은 1~3건뿐입니다.<\/p><div class=\"n2-chart\" data-draw=\"dur-cross\" data-source=\"dur_cross\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-a\"><\/i>끝난 사업<\/span><span><i data-draw=\"sw-m\"><\/i>진행 중 사업(최초 허가부터)<\/span><\/div><span class=\"n2-src\">한국전력거래소, 「발전소 건설사업 추진현황」 2016년 4분기~2026년 상반기 10개 회차 (2022년 4분기는 PDF 글자를 읽을 수 없어 제외)<\/span><\/div>\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-dur\">사업별 허가 → 준공(예정) 기간<\/h3><p>'26 상반기 회차만 본 그림입니다. 점 하나가 사업 하나, 세로 막대가 중앙값. 준공은 예정일 포함이라 계획 기간이고, 신재생의 허가일은 이 회차에 실린 최근 (변경)허가일이라 위 그림보다 짧게 나옵니다. 중앙 발전소의 허가일은 사업별 상세 페이지의 최초허가입니다. 속 빈 점은 허가를 묵혀 둔 LNG 집단에너지(허가→준공 15년 초과)로, 점은 남기되 중앙값에서는 뺐습니다. 점에 마우스를 올리면 발전소 이름과 허가 이력이 나옵니다.<\/p><div class=\"n2-chart n2-tall\" data-draw=\"dur\" data-source=\"kpx_durations\"><\/div><span class=\"n2-src\">한국전력거래소, 「발전소 건설사업 추진현황」 2026년 상반기 (3.31 기준, 사업자 제출분)<\/span><\/div>\n      <div class=\"n2-card n2-card-third\"><h3 id=\"c-iea\">세계 기준 건설기간<\/h3><p>일반적 사업 기준, 공급망 장비 지연 제외. 계통 접속은 3–7년 이상.<\/p><div class=\"n2-chart\" data-draw=\"iea\" data-source=\"iea_build\"><\/div><span class=\"n2-src\">IEA, <a href=\"https://www.iea.org/files/de9dea13-b07d-42c5-a398-d1b3ae17d866/EnergyandAI.pdf\" target=\"_blank\" rel=\"noopener\">Energy and AI<\/a> (2025) 표 2.3<\/span><\/div>\n      <div class=\"n2-card n2-card-third\"><h3 id=\"c-irena\">한국 발전원별 연간 설비 순증<\/h3><p>설비용량의 연도 차분(GW). 음수와 '02·'05년 LNG처럼 튀는 값은 폐지와 통계 재분류가 섞인 것입니다.<\/p><div class=\"n2-chart\" data-draw=\"irena\" data-source=\"irena_additions\"><\/div><div class=\"n2-legend\" data-draw=\"irena-legend\"><\/div><span class=\"n2-src\">IRENA, Renewable Energy Statistics 2026, IRENASTAT <a href=\"https://pxweb.irena.org/api/v1/en/IRENASTAT/Power%20Capacity%20and%20Generation/Country_ELECSTAT_2026_H2_PX.px\" target=\"_blank\" rel=\"noopener\">Country_ELECSTAT_2026_H2<\/a>, 한국 기술별 설비용량(MW)의 연도 차분. LNG는 IRENA의 Natural gas.<\/span><\/div>\n      <div class=\"n2-card n2-card-third\"><h3 id=\"c-perm\">허가 물량 대비 일정 제출 물량<\/h3><p>발전사업 허가(3MW 초과) 중 추진현황을 낸 물량(GW).<\/p><div class=\"n2-chart\" data-draw=\"perm\" data-source=\"kpx_permitted\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-m\"><\/i>사업허가<\/span><span><i data-draw=\"sw-a\"><\/i>추진현황 제출<\/span><\/div><span class=\"n2-src\">한국전력거래소, 「발전소 건설사업 추진현황」 2026년 상반기 p.11<\/span><\/div>\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-entry\">연도별 진입 예정 신재생<\/h3><p>GW/년. 막대는 KPX에 사업자가 낸 진입 일정(3MW 초과 허가 사업만이라 소규모 태양광이 빠짐), 선은 세 계획의 연간 신규 물량입니다. 11차는 연도별 표, 나머지는 목표 연도 사이 평균 속도입니다. '26~'30년은 제1차 재생에너지 기본계획(점선)과 12차 잠정안이 거의 같아 선이 겹칩니다. 기타(바이오·연료전지 등) 진입 일정은 뺐습니다. 마우스를 올리면 값이 나옵니다.<\/p><div class=\"n2-chart\" data-draw=\"entry\" data-source=\"kpx_re_entry\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-solar\"><\/i>태양광 KPX 제출<\/span><span><i data-draw=\"sw-wind\"><\/i>풍력 KPX 제출<\/span><span><i data-draw=\"sw-fg\"><\/i>11차 전기본<\/span><span><i data-draw=\"sw-nuc\"><\/i>제1차 재생에너지 기본계획<\/span><span><i data-draw=\"sw-gas\"><\/i>12차 전기본 잠정안<\/span><\/div><span class=\"n2-src\">한국전력거래소, 「발전소 건설사업 추진현황」 2026년 상반기 p.10 · 계획: 「제11차 전력수급기본계획」 p.105 · 산업통상자원부, 「제1차 재생에너지 기본계획」 p.17 · 12차 전기본 재생에너지 보급 전망 잠정안 (2026.8.26, <a href=\"https://news.tf.co.kr/read/economy/2358341.htm\" target=\"_blank\" rel=\"noopener\">더팩트 보도<\/a>, 확정 전)<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ③ -->\n  <section class=\"n2-sec\" id=\"s3\" data-sec=\"s3\" role=\"tabpanel\" aria-labelledby=\"tab-s3\" hidden>\n    <h2 class=\"n2-q\">가스의 숨은 비용은 장기적 불확실성이다<\/h2>\n    <p class=\"n2-claim\">LNG 발전 연료비는 '11년 이후 <b data-draw=\"s3-c1\" data-source=\"fuel_range\" data-field=\"min\">—<\/b>원/kWh에서 <b data-draw=\"s3-c2\" data-source=\"fuel_range\" data-field=\"max\">—<\/b>원/kWh 사이를 오갔습니다. <b data-draw=\"s3-c3\" data-source=\"fuel_range\" data-field=\"ratio\">—<\/b>배 차이입니다. 연료를 사 와야 하는 한 이 폭은 줄지 않습니다.<\/p>\n    <div class=\"n2-tiles\">\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">LNG 연료비 최근월<\/span><span class=\"n2-tile-value\"><span data-draw=\"s3-t1\" data-source=\"fuel_range\" data-field=\"latest\">—<\/span><span class=\"n2-unit\">원/kWh<\/span><\/span><span class=\"n2-tile-note\" data-draw=\"s3-t1m\" data-source=\"fuel_range\" data-field=\"latest_month\">—<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">'11년 이후 최고<\/span><span class=\"n2-tile-value\"><span data-draw=\"s3-t2\" data-source=\"fuel_range\" data-field=\"max\">—<\/span><span class=\"n2-unit\">원/kWh<\/span><\/span><span class=\"n2-tile-note\" data-draw=\"s3-t2m\" data-source=\"fuel_range\" data-field=\"max_month\">—<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">KAU26 기준 탄소비용 '26<\/span><span class=\"n2-tile-value\"><span data-draw=\"s3-t3\" data-source=\"carbon_alloc\" data-field=\"kau26_actual\" data-where=\"year=2026\">—<\/span><span class=\"n2-unit\">원/kWh<\/span><\/span><span class=\"n2-tile-note\">유상할당 15%분. 전량 유상이면 <span data-draw=\"s3-t3b\" data-source=\"carbon_alloc\" data-field=\"kau26_full\" data-where=\"year=2026\">—<\/span>원<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">'30년 탄소 10만원/t이면<\/span><span class=\"n2-tile-value\"><span data-draw=\"s3-t4\" data-source=\"carbon_alloc\" data-field=\"k100_actual\" data-where=\"year=2030\">—<\/span><span class=\"n2-unit\">원/kWh<\/span><\/span><span class=\"n2-tile-note\">유상할당 50%분, 가격은 가정. 전량 유상이면 <span data-draw=\"s3-t4b\" data-source=\"carbon_alloc\" data-field=\"k100_full\" data-where=\"year=2030\">—<\/span>원<\/span><\/div>\n    <\/div>\n    <div class=\"n2-grid\">\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-fuel\">발전원별 연료비단가, 월별<\/h3><p>원/kWh, '01.4~'26.9.<\/p><div class=\"n2-chart\" data-draw=\"fuel\" data-source=\"fuel_monthly\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-gas\"><\/i>LNG<\/span><span><i data-draw=\"sw-coal\"><\/i>유연탄<\/span><span><i data-draw=\"sw-nuc\"><\/i>원자력<\/span><\/div><span class=\"n2-src\">한국전력거래소 전력통계정보시스템(<a href=\"https://epsis.kpx.or.kr\" target=\"_blank\" rel=\"noopener\">EPSIS<\/a>), 연료원별 연료비단가 월별 (2001.4~2026.9)<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-sens\">LNG 가격 × 환율에 따른 연료비<\/h3><p>칸 값은 원/kWh. 열소비율 1.749 Mcal/kWh('21–'26 KPX 중앙값).<\/p><div class=\"n2-chart\" data-draw=\"sens\" data-source=\"lng_sensitivity\"><\/div><span class=\"n2-src\"><a href=\"https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx\" target=\"_blank\" rel=\"noopener\">World Bank Pink Sheet<\/a> LNG(일본) 월별 · <a href=\"https://data.ecb.europa.eu/data/datasets/EXR\" target=\"_blank\" rel=\"noopener\">ECB 환율<\/a> · 계산: KPX <a href=\"https://epsis.kpx.or.kr\" target=\"_blank\" rel=\"noopener\">EPSIS<\/a> 연료비단가<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-carbon\">가스복합 탄소비용, 유상할당 비율대로<\/h3><p>원/kWh. 막대는 실제 부담(가격 × 390 gCO₂/kWh × 발전부문 유상할당 비율), 점선은 전량 유상일 때의 상한. 5·10만원/t는 가정값. 무상할당분은 비용이 없다고 단순화했습니다.<\/p><div class=\"n2-chart\" data-draw=\"carbon\" data-source=\"carbon_alloc\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-m\"><\/i>KAU26 최근가<\/span><span><i data-draw=\"sw-gas2\"><\/i>5만원/t<\/span><span><i data-draw=\"sw-gas\"><\/i>10만원/t<\/span><\/div><span class=\"n2-src\">한국거래소 <a href=\"https://ets.krx.co.kr/contents/ETS/03/03010000/ETS03010000.jsp\" target=\"_blank\" rel=\"noopener\">배출권시장 정보플랫폼<\/a> KAU 종가 (내부용) · IEA <a href=\"https://www.iea.org/files/de9dea13-b07d-42c5-a398-d1b3ae17d866/EnergyandAI.pdf\" target=\"_blank\" rel=\"noopener\">Energy and AI<\/a> 표 2.3 배출계수 · 기후에너지환경부 보도설명자료 <a href=\"https://www.korea.kr/briefing/pressReleaseView.do?newsId=156727612\" target=\"_blank\" rel=\"noopener\">「발전부문 유상할당은 초기 부담 완화하여 단계적 상승」<\/a> (2025.11.11)<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ④ -->\n  <section class=\"n2-sec\" id=\"s4\" data-sec=\"s4\" role=\"tabpanel\" aria-labelledby=\"tab-s4\" hidden>\n    <h2 class=\"n2-q\">재생에너지 포트폴리오는 다른 선택지를 준다<\/h2>\n    <p class=\"n2-claim\">2025년 태양광과 풍력의 시간별 상관은 <b data-draw=\"s4-c1\" data-source=\"re_correlation\" data-field=\"pearson_r_solar_wind\" data-where=\"resolution=hourly\">—<\/b>입니다. 태양광만 쓸 때 시간별 변동계수 <b data-draw=\"s4-c2\" data-source=\"mix_variability\" data-field=\"hourly_cv_pct\" data-row=\"0\">—<\/b>%가, 태양광:풍력 3:7로 섞으면 <b data-draw=\"s4-c3\" data-source=\"mix_variability\" data-field=\"hourly_cv_pct\" data-row=\"3\">—<\/b>%로 줄어듭니다. 다만 일 단위 변동계수는 3:7에서 <b data-draw=\"s4-c4\" data-source=\"mix_variability\" data-field=\"daily_cv_pct\" data-row=\"3\">—<\/b>%로 태양광 단독(<b data-draw=\"s4-c5\" data-source=\"mix_variability\" data-field=\"daily_cv_pct\" data-row=\"0\">—<\/b>%)보다 커집니다. 2025년 한 해의 시장 거래분 기준입니다.<\/p>\n    <div class=\"n2-tiles\">\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">시간별 상관 r<\/span><span class=\"n2-tile-value\" data-draw=\"s4-t1\" data-source=\"re_correlation\" data-field=\"pearson_r_solar_wind\" data-where=\"resolution=hourly\">—<\/span><span class=\"n2-tile-note\">태양광 vs 풍력<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">일별 상관 r<\/span><span class=\"n2-tile-value\" data-draw=\"s4-t2\" data-source=\"re_correlation\" data-field=\"pearson_r_solar_wind\" data-where=\"resolution=daily\">—<\/span><span class=\"n2-tile-note\">일평균 기준<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">월별 상관 r<\/span><span class=\"n2-tile-value\" data-draw=\"s4-t3\" data-source=\"re_correlation\" data-field=\"pearson_r_solar_wind\" data-where=\"resolution=monthly\">—<\/span><span class=\"n2-tile-note\">태양광은 봄, 풍력은 겨울<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">평균의 20% 미만인 시간<\/span><span class=\"n2-tile-value\"><span data-draw=\"s4-t4\" data-source=\"mix_variability\" data-field=\"hours_below_20pct_of_mean_pct\" data-row=\"3\">—<\/span><span class=\"n2-unit\">%<\/span><\/span><span class=\"n2-tile-note\">3:7 조합, 태양광 단독은 <span data-draw=\"s4-t4b\" data-source=\"mix_variability\" data-field=\"hours_below_20pct_of_mean_pct\" data-row=\"0\">—<\/span>%<\/span><\/div>\n    <\/div>\n    <div class=\"n2-grid\">\n      <div class=\"n2-card\"><h3 id=\"c-hm-solar\">태양광 이용률: 시간대 × 월<\/h3><p>2025, 이용률(%) = 거래량 ÷ 설비용량.<\/p><div class=\"n2-chart\" data-draw=\"hm-solar\" data-source=\"hour_month\"><\/div><span class=\"n2-src\">한국전력거래소, 연료원별 시간별 전력거래량·설비용량 2025 (<a href=\"https://www.data.go.kr\" target=\"_blank\" rel=\"noopener\">공공데이터포털<\/a>)<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-hm-wind\">풍력 이용률: 시간대 × 월<\/h3><p>원자료에 육상·해상 구분이 없음.<\/p><div class=\"n2-chart\" data-draw=\"hm-wind\" data-source=\"hour_month\"><\/div><span class=\"n2-src\">같은 자료<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-mix\">섞으면 시간 단위 변동이 줄어든다<\/h3><p>연간 발전량 비율별 변동 지표(%). 일 단위로는 7:3이 가장 낮고 3:7은 태양광 단독보다 높음. 태양광에 연계 ESS의 저녁 방전 포함. ESS·계통 효과 미포함.<\/p><div class=\"n2-chart\" data-draw=\"mix\" data-source=\"mix_variability\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-m\"><\/i>시간별 변동계수<\/span><span><i data-draw=\"sw-a\"><\/i>일별 변동계수<\/span><span><i data-draw=\"sw-gas\"><\/i>평균의 20% 미만인 시간<\/span><\/div><span class=\"n2-src\">같은 자료로 계산<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-shape\">하루 모양: 시장 총거래량과 비교<\/h3><p>일평균 = 1. 총거래량은 전 연료원 시장 거래분 합(양수·ESS 포함, 자가·PPA 태양광 제외)으로 수요와 같지 않음.<\/p><div class=\"n2-chart\" data-draw=\"shape\" data-source=\"daily_shape\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-fg\"><\/i>총거래량<\/span><span><i data-draw=\"sw-solar\"><\/i>태양광<\/span><span><i data-draw=\"sw-wind\"><\/i>풍력<\/span><\/div><span class=\"n2-src\">같은 자료<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ⑤ -->\n  <section class=\"n2-sec\" id=\"s5\" data-sec=\"s5\" role=\"tabpanel\" aria-labelledby=\"tab-s5\" hidden>\n    <h2 class=\"n2-q\">AI 경쟁력은 청정전력 확보 전략에 달려 있다<\/h2>\n    <p class=\"n2-claim\">12차 재전망의 '40년 데이터센터 순증분 84.9TWh를 LNG 발전 대신 재생이 공급하면 '25년 천연가스 수입의 <b data-draw=\"s5-c1\" data-source=\"re_substitution\" data-field=\"share_of_2025_gas_import_pct\" data-where=\"re_twh_replacing_lng=84.9\">—<\/b>%(발전·열병합 투입의 <b data-draw=\"s5-c5\" data-source=\"re_substitution\" data-field=\"share_of_2025_power_chp_input_pct\" data-where=\"re_twh_replacing_lng=84.9\">—<\/b>%), 연료비 <b data-draw=\"s5-c2\" data-source=\"re_substitution\" data-field=\"fuel_cost_saving_trillion_krw_2025avg\" data-where=\"re_twh_replacing_lng=84.9\">—<\/b>조원이 줄어듭니다. 참고로 12차 재전망 전에 나온 KEEI 장기에너지전망 기준안에서는 '50년 변동성 재생 설비가 <b data-draw=\"s5-c3\" data-source=\"keei_power\" data-field=\"2050\" data-where=\"block=capacity_gw&amp;source=- 변동성 재생에너지\">—<\/b>GW로 늘어도 가스 발전량이 <b data-draw=\"s5-c4\" data-source=\"keei_power\" data-field=\"2050\" data-where=\"block=generation_twh&amp;source=가스\">—<\/b>TWh입니다. 11차 전기본 계획대로라면 LNG 발전은 2038년 <b data-draw=\"s5-c6\" data-source=\"gas_paths\" data-field=\"gas_twh\" data-where=\"source=11차 전기본&amp;year=2038\">—<\/b>TWh까지 줄어, 두 경로의 차이가 계획을 이행해야 메울 몫입니다.<\/p>\n    <div class=\"n2-tiles\">\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">DC 순증분 84.9TWh 대체 시 연료비 절감<\/span><span class=\"n2-tile-value\"><span data-draw=\"s5-t1\" data-source=\"re_substitution\" data-field=\"fuel_cost_saving_trillion_krw_2025avg\" data-where=\"re_twh_replacing_lng=84.9\">—<\/span><span class=\"n2-unit\">조원/년<\/span><\/span><span class=\"n2-tile-note\">'25 평균 연료비 단가<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">줄어드는 LNG<\/span><span class=\"n2-tile-value\"><span data-draw=\"s5-t2\" data-source=\"re_substitution\" data-field=\"lng_mt_avoided\" data-where=\"re_twh_replacing_lng=84.9\">—<\/span><span class=\"n2-unit\">Mt/년<\/span><\/span><span class=\"n2-tile-note\">DC 순증분 84.9TWh 대체 시<\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">'25 천연가스 수입<\/span><span class=\"n2-tile-value\"><span data-draw=\"s5-t3\" data-source=\"gas_power_share\" data-field=\"import_pj\" data-where=\"year=2025\">—<\/span><span class=\"n2-unit\">PJ<\/span><\/span><span class=\"n2-tile-note\">발전·열병합 투입 <span data-draw=\"s5-t3b\" data-source=\"gas_power_share\" data-field=\"share\" data-where=\"year=2025\">—<\/span><\/span><\/div>\n      <div class=\"n2-tile\"><span class=\"n2-tile-label\">11차 '38 LNG 발전<\/span><span class=\"n2-tile-value\"><span data-draw=\"s5-t4\" data-source=\"gas_paths\" data-field=\"gas_twh\" data-where=\"source=11차 전기본&amp;year=2038\">—<\/span><span class=\"n2-unit\">TWh<\/span><\/span><span class=\"n2-tile-note\">KEEI 기준안 '40 <span data-draw=\"s5-t4b\" data-source=\"gas_paths\" data-field=\"gas_twh\" data-where=\"source=KEEI 기준안&amp;year=2040\">—<\/span>TWh<\/span><\/div>\n    <\/div>\n    <div class=\"n2-grid\">\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-gen-mix\">발전원별 발전량: 11차 전기본 계획과 KEEI 기준 전망<\/h3><p>TWh, 누적. 막대 하나가 그해 총발전량이고 맨 아래가 가스입니다. 두 자료는 이어 붙이지 않고 각각 연도순으로 놓았습니다. 11차는 온실가스 감축목표를 제약으로 넣은 정부 계획('23은 실적), KEEI는 정책 목표를 강제하지 않은 기준 전망('24는 기준값)입니다. 재생에너지에 KEEI는 수력을 더했고, 수소·신에너지는 11차의 신에너지와 청정수소·암모니아, 상용자가는 KEEI 총발전량에만 있는 한전 구입분입니다. 둘 다 12차 재전망 이전 자료라 데이터센터 순증분 84.9TWh는 들어 있지 않습니다.<\/p><div class=\"n2-chart n2-tall\" data-draw=\"gen-mix\" data-source=\"gen_mix\"><\/div><div class=\"n2-legend\" data-draw=\"gen-mix-legend\"><\/div><span class=\"n2-src\">산업통상자원부, 「제11차 전력수급기본계획(2024~2038)」 2025.3.13 수정공고, p.51·p.53 · 에너지경제연구원, 「장기 에너지 전망」 기준 시나리오(REF) 부표 A1-11 (팀 제공 파일)<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-gas\">천연가스 수입과 발전 투입<\/h3><p>PJ. 열병합 투입은 열 생산분 포함.<\/p><div class=\"n2-chart\" data-draw=\"gas\" data-source=\"gas_balance\"><\/div><div class=\"n2-legend\"><span><i data-draw=\"sw-m\"><\/i>수입<\/span><span><i data-draw=\"sw-gas\"><\/i>발전전용<\/span><span><i data-draw=\"sw-gas2\"><\/i>열병합<\/span><\/div><span class=\"n2-src\">에너지경제연구원, <a href=\"https://kesis.keei.re.kr/statHtml/statHtml.do?orgId=339&tblId=DT_BAL_SIMPLE_TJULE&conn_path=I3\" target=\"_blank\" rel=\"noopener\">「국가에너지수급통계(간이 에너지밸런스, TJ)」<\/a> 2023~2025 (2024·2025년은 잠정치)<\/span><\/div>\n      <div class=\"n2-card\"><h3 id=\"c-subst\">재생이 LNG 발전을 대체할 때<\/h3><p>연료비 절감(조원/년). 12차 재전망 데이터센터 '40년 수요(순증분, 전체)를 재생이 LNG 발전 대신 1TWh 대 1TWh로 공급한다고 가정. 열소비율 1.734 Mcal/kWh, LNG 13.17 Gcal/t, 연료비 124원/kWh(모두 '25 KPX 평균). 백업·계통 비용 미포함.<\/p><div class=\"n2-chart\" data-draw=\"subst\" data-source=\"re_substitution\"><\/div><span class=\"n2-src\">대체량: 12차 전기본 5차 토론회 발표자료 p.11 (<a href=\"https://naver.me/GGG5lbiF\" target=\"_blank\" rel=\"noopener\">발표자료 내려받기<\/a>) · 열소비율·LNG 열량·연료비: KPX <a href=\"https://epsis.kpx.or.kr\" target=\"_blank\" rel=\"noopener\">EPSIS<\/a> 연료비단가 2025 월별 · 수입·발전 투입: <a href=\"https://kesis.keei.re.kr/statHtml/statHtml.do?orgId=339&tblId=DT_BAL_SIMPLE_TJULE&conn_path=I3\" target=\"_blank\" rel=\"noopener\">「국가에너지수급통계(간이 에너지밸런스)」<\/a> 2025 잠정치<\/span><\/div>\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-routes\">AIDC가 청정전력을 사는 경로<\/h3><p>법령 문언만 읽은 판단입니다. 실제 조건(망이용료·부가정산금·고시 요건)은 고시와 약관에 있어 여기서 판단하지 않았습니다.<\/p>\n        <div class=\"n2-tablebox\"><table class=\"n2-table\" data-source=\"ppa_routes\" data-row-key=\"route\"><thead><tr><th data-field=\"route\">경로<\/th><th data-field=\"legal_basis\">근거<\/th><th data-field=\"what_it_allows\">허용하는 것<\/th><th data-field=\"constraint_in_text\">문언상 제약<\/th><th data-field=\"reading\">판단<\/th><\/tr><\/thead><tbody data-draw=\"routes\"><\/tbody><\/table><\/div>\n        <span class=\"n2-src\"><a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A0%84%EA%B8%B0%EC%82%AC%EC%97%85%EB%B2%95\" target=\"_blank\" rel=\"noopener\">「전기사업법」<\/a>·<a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A0%84%EA%B8%B0%EC%82%AC%EC%97%85%EB%B2%95%EC%8B%9C%ED%96%89%EB%A0%B9\" target=\"_blank\" rel=\"noopener\">「전기사업법 시행령」<\/a> 조문에서 정리 (국가법령정보센터)<\/span><\/div>\n      <div class=\"n2-card n2-card-wide\"><h3 id=\"c-ppa\">PPA·전력시장 관련 조문<\/h3><p>위 경로표의 근거 조문 원문: 재생에너지 전기공급, 전력거래, 직접구매, 차액계약.<\/p>\n        <div class=\"n2-tablebox\"><table class=\"n2-table\" data-source=\"ppa_clauses\" data-row-key=\"law,article\"><thead><tr><th data-field=\"law\">법령<\/th><th data-field=\"article\">조문<\/th><th data-field=\"title\">제목<\/th><th data-field=\"text\">내용<\/th><\/tr><\/thead><tbody data-draw=\"ppa\"><\/tbody><\/table><\/div>\n        <span class=\"n2-src\">국가법령정보센터 <a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A0%84%EA%B8%B0%EC%82%AC%EC%97%85%EB%B2%95\" target=\"_blank\" rel=\"noopener\">「전기사업법」<\/a>·<a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A0%84%EA%B8%B0%EC%82%AC%EC%97%85%EB%B2%95%EC%8B%9C%ED%96%89%EB%A0%B9\" target=\"_blank\" rel=\"noopener\">「전기사업법 시행령」<\/a><\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <details>\n    <summary>방법과 한계<\/summary>\n    <dl>\n      <dt>데이터<\/dt><dd>모든 수치는 VOID base(clif-originals)에 플러그인으로 받은 원자료를 project DB(clif-n2)와 세션 S1~S5에서 계산한 결과 파일입니다.<\/dd>\n      <dt>허가→준공<\/dt><dd>v2는 KPX 추진현황 11개 회차 중 10개('22Q4는 PDF 글자를 읽을 수 없음)를 이어 사업 334개를 만들었습니다. 2026H1에 남아 있으면 진행 중, 마지막으로 실린 준공 예정일이 다음 회차 기준일 이전이면 끝난 사업(추정), 그 전에 목록에서 빠지면 제외로 나눴습니다. 끝난 사업의 준공일은 확인된 상업운전일이 아니라 마지막으로 실린 예정일이고, 회차 간격(1년, '21Q4→'23Q4는 2년)만큼 불확실합니다. 목록 기준(40MW 초과 → 30MW 이상 → 20MW 이상)이 바뀌었고 제출이 자율이라, 목록에서 빠진 사업은 취소가 아니라 제출 중단일 수 있습니다. '24H2부터 신재생 목록은 가장 최근 (변경)허가일을 싣기 때문에, 허가일은 어느 회차에서든 가장 이른 날짜를 썼습니다. 아래 '26 상반기 그림은 v1과 같은 방식입니다: 준공 예정일을 포함한 계획 기간입니다. 중앙 발전소(표1)의 허가일은 요약표가 아니라 사업별 상세 페이지의 최초허가입니다(요약표는 대전열병합처럼 변경허가일을 적은 경우가 있음). LNG 집단에너지 중 허가→준공 15년 초과 5건(수원 집단에너지, 대전열병합, 마곡열병합, 송산빛그린, 여수그린에너지)은 허가를 14~39년 묵혀 둔 사업이라 중앙값에서 뺐습니다. 병합 셀의 발전원 구분은 위 행에서 이어받았고, 준공 미정 6건은 뺐습니다. 신재생 표의 허가일은 변경허가일일 수 있어 기간이 짧게 잡힐 수 있습니다.<\/dd>\n      <dt>연료비 민감도<\/dt><dd>연료비 = LNG 가격 × 환율 × 3.968 MMBtu/Gcal × 열소비율. 열소비율은 '21–'26 중앙값 1.749 Mcal/kWh로, ⑤의 '25 평균 1.734와 기간이 다릅니다.<\/dd>\n      <dt>탄소비용<\/dt><dd>실제 부담 = KAU 가격 × 390 gCO₂/kWh × 발전부문 유상할당 비율('26 15%, '27 20%, '28 30%, '29 40%, '30 50%, 4기 최종안). 무상할당분의 기회비용과 KPX 정산 반영 방식은 넣지 않았습니다. CSV의 정산단가에서 태양광·풍력 거래가 없던 달('02~'04)의 0은 빈칸으로 바꿨고, '14.6월 태양광 정산단가(588원/kWh)는 KPX 원값 그대로입니다.<\/dd>\n      <dt>이용률·상관<\/dt><dd>KPX 연료원별 시간별 '전력거래량' 자료입니다(자가·PPA 포함 여부는 원자료에 명시 없음). 풍력은 육상·해상 구분이 없는 단일 항목입니다. 태양광 값에는 연계 ESS의 저녁 방전이 섞여 있습니다(18시~06시가 연간 6.5%).<\/dd>\n      <dt>재생 대체<\/dt><dd>재생 1TWh가 LNG 발전 1TWh를 대체한다고 가정했습니다. 대체량은 12차 재전망의 데이터센터 '40년 수요(순증분 84.9TWh, 전체 100.6TWh)입니다. 열소비율 1.734 Mcal/kWh·LNG 13.17 Gcal/t·연료비 124원/kWh는 '25 KPX 연료비단가에서 구했습니다. 수입 대비 비율의 분모는 도시가스·산업용을 포함한 전체 천연가스 수입입니다. 백업·저장·계통 비용은 넣지 않았습니다.<\/dd>\n      <dt>12차 전기본<\/dt><dd>v2의 단일 시나리오입니다. 데이터센터 수요는 12차 전기본 전력수요 재전망 5차 공개토론회('26.8.20) 발표자료 p.11의 잠정안(기준·상향 같은 값)입니다. '40년 전체 100.6TWh·14.2GW에서 모형수요에 이미 든 추세(15.7TWh·2.3GW)를 뺀 순증분 84.9TWh·11.9GW가 추가수요로 반영됐습니다. 기후부는 '26.10월 이 값의 하향 조정을 예고했고, 12차 전기본은 아직 확정 전입니다. KEEI 장기에너지전망 기준안은 재전망 이전 자료라 참고로만 둡니다.<\/dd>\n      <dt>PPA 경로<\/dt><dd>전기사업법·시행령 문언만 읽었습니다. 고시·약관·시장운영규칙은 확인하지 않았고 법률 자문이 아닙니다.<\/dd>\n      <dt>빠진 것<\/dt><dd>12차 전기본 공식 수치(미공개), 가스 vs 재생+ESS 장기비용, 시나리오별 비용·배출은 모델링 단계에서 다룹니다.<\/dd>\n    <\/dl>\n  <\/details>\n<\/div>\n\n<script>\n(function () {\n  const N = {};\n  window.N2 = N;\n  // Fit every chart's SVG to everything it drew, so long labels (English ones especially) are never cut at the card edge.\n  const fit = (el) => el.querySelectorAll(':scope > svg').forEach((svg) => {\n    try {\n      const vb = svg.viewBox.baseVal; const bb = svg.getBBox(); if (!vb || !bb.width) return;\n      const x0 = Math.min(0, bb.x - 2), y0 = Math.min(0, bb.y - 2);\n      const x1 = Math.max(vb.width, bb.x + bb.width + 4), y1 = Math.max(vb.height, bb.y + bb.height + 2);\n      svg.setAttribute('viewBox', `${x0} ${y0} ${x1 - x0} ${y1 - y0}`); svg.setAttribute('height', y1 - y0);\n    } catch (e) { /* hidden or not yet laid out */ }\n  });\n  const _draw = dash.draw.bind(dash);\n  dash.draw = (name, fn) => _draw(name, (el) => { fn(el); fit(el); });\n  N.css = (name) => getComputedStyle(document.getElementById('dash-root') || document.documentElement).getPropertyValue(name).trim();\n  N.col = () => ({\n    a: dash.colors[0], b: dash.colors[1], c: dash.colors[2], d: dash.colors[3],\n    m: N.css('--cds-chart-muted') || '#aaa', fg: N.css('--color-fg') || '#222',\n    gas: dash.colors[3] || '#c0392b', solar: dash.colors[2] || '#e6a817', wind: dash.colors[0], nuc: dash.colors[4] || '#7d3c98', coal: N.css('--color-fg-muted') || '#666',\n    gas2: dash.colors[5] || '#e8a598'\n  });\n  N.rgb = (v, fallback) => {\n    const root = document.getElementById('dash-root') || document.body;\n    const p = document.createElement('span'); p.style.color = fallback || '#888'; p.style.color = v; p.style.display = 'none'; root.appendChild(p);\n    const out = getComputedStyle(p).color; p.remove();\n    return d3.color(out) ? out : (fallback || '#888');\n  };\n  N.ramp = (from, to) => d3.interpolateRgb(N.rgb(from, '#ffffff'), N.rgb(to, '#c0392b'));\n  N.num = (v) => (v === null || v === undefined || v === '' ? NaN : Number(v));\n  N.rows = (id) => { const d = dash.data(id); return d.status === 'ok' ? d.data : null; };\n  N.fail = (el, id) => {\n    const st = dash.data(id).status;\n    el.classList.toggle('dash-skeleton', st === 'loading');\n    if (st === 'error' || st === 'missing' || st === 'declined') { el.replaceChildren(); const f = document.createElement('div'); f.className = 'n2-fail'; f.textContent = 'Failed to load'; el.appendChild(f); return true; }\n    if (st !== 'ok') { el.replaceChildren(); return true; }\n    return false;\n  };\n  N.svg = (el, h, m) => {\n    el.replaceChildren();\n    const W = Math.max(280, el.clientWidth || 600);\n    const svg = d3.select(el).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${h}`).attr('height', h);\n    return { svg, W, h, m, iw: W - m.l - m.r, ih: h - m.t - m.b, g: svg.append('g').attr('transform', `translate(${m.l},${m.t})`) };\n  };\n  N.axis = (sel) => sel.attr('font-size', null).attr('font-family', null);\n  N.tip = (el) => {\n    const t = document.createElement('div'); t.className = 'n2-tip'; t.hidden = true; el.appendChild(t);\n    return {\n      show(lines, x, y) {\n        t.replaceChildren(...lines.map((s) => { const d = document.createElement('div'); d.textContent = s; return d; }));\n        t.hidden = false;\n        const W = el.clientWidth, tw = t.offsetWidth;\n        t.style.left = Math.min(Math.max(0, x + 12), Math.max(0, W - tw)) + 'px';\n        t.style.top = Math.max(0, y - 10) + 'px';\n      },\n      hide() { t.hidden = true; }\n    };\n  };\n  N.f1 = d3.format(',.1f'); N.f0 = d3.format(',.0f'); N.f2 = d3.format('.2f');\n  N.cell = (el, id, field, where, fmt) => {\n    if (dash.data(id).status !== 'ok') { el.textContent = '—'; return; }\n    const rows = dash.data(id).data;\n    const ri = el.dataset.row !== undefined ? Number(el.dataset.row) : null;\n    const r = ri !== null ? rows[ri] : where ? rows.find((x) => Object.entries(where).every(([k, v]) => String(x[k]) === String(v))) : rows[0];\n    el.textContent = r && r[field] !== undefined && r[field] !== null && r[field] !== '' ? fmt(r[field]) : '—';\n  };\n  N.dec = (x) => { try { return decodeURIComponent(x); } catch (e) { return x; } };\n  N.parseWhere = (s) => { if (!s) return null; const o = {}; s.split('&').forEach((p) => { const i = p.indexOf('='); o[N.dec(p.slice(0, i))] = N.dec(p.slice(i + 1)); }); return o; };\n})();\n<\/script>\n\n<script>\n// Tabs and links\n(function () {\n  const show = (id) => {\n    document.querySelectorAll('[data-sec]').forEach((s) => { s.hidden = s.dataset.sec !== id; });\n    document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === id)));\n  };\n  document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { show(b.dataset.tab); dash.setLink(b.dataset.tab); }));\n  const named = location.hash.slice(1);\n  if (['s1', 's2', 's3', 's4', 's5', 'sl'].includes(named)) show(named);\n})();\n<\/script>\n\n<script>\n// Calcs\ndash.calc('dc_supply_share', {\n  title: '공급가능 판정 비율 (\\'27)', description: '\\'27 누적 공급가능 ÷ 전기사용신청',\n  inputs: ['dc_applications'],\n  fn: (dc_applications) => { const r = dc_applications.find((x) => String(x.year) === '2027'); return [{ share: Number(r.supply_feasible_mw_cum) / Number(r.applied_mw_cum) }]; }\n});\ndash.calc('dur_median', {\n  title: '허가→준공 중앙값', description: '발전원별 허가→준공(예정) 기간의 중앙값(년)과 사업 수',\n  inputs: ['kpx_durations'],\n  fn: (kpx_durations) => {\n    const g = {};\n    kpx_durations.forEach((r) => { const v = Number(r.permit_to_completion_y); if (v >= 0 && String(r.median_excluded) !== '1') (g[r.tech] = g[r.tech] || []).push(v); });\n    return Object.entries(g).map(([tech, v]) => { v.sort((a, b) => a - b); const n = v.length; const med = n % 2 ? v[(n - 1) / 2] : (v[n / 2 - 1] + v[n / 2]) / 2; return { tech, median_y: Math.round(med * 10) / 10, n }; });\n  }\n});\ndash.calc('dur_permit_range', {\n  title: '발전원별 허가일 범위', description: '진행 중 사업의 최초 허가월(가장 이른 달)',\n  inputs: ['kpx_durations'],\n  fn: (kpx_durations) => { const g = {}; kpx_durations.forEach((r) => { if (r.permit && (!g[r.tech] || r.permit < g[r.tech])) g[r.tech] = r.permit; }); return Object.entries(g).map(([tech, first]) => ({ tech, first })); }\n});\ndash.calc('fuel_range', {\n  title: 'LNG 연료비 범위', description: '\\'11.1 이후 월별 LNG 연료비단가의 최저·최고·배수와 최근월',\n  inputs: ['fuel_monthly'],\n  fn: (fuel_monthly) => {\n    const v = fuel_monthly.filter((r) => r.month >= '2011-01' && r.lng_fuel !== '' && r.lng_fuel != null).map((r) => ({ m: r.month, x: Number(r.lng_fuel) }));\n    const lo = v.reduce((a, b) => (b.x < a.x ? b : a)); const hi = v.reduce((a, b) => (b.x > a.x ? b : a)); const last = v[v.length - 1];\n    return [{ min: lo.x, min_month: lo.m, max: hi.x, max_month: hi.m, ratio: hi.x / lo.x, latest: last.x, latest_month: last.m }];\n  }\n});\ndash.calc('gas_power_share', {\n  title: '천연가스 수입(PJ)과 발전·열병합 비중', description: '수입 TJ ÷ 1,000 = PJ, (발전전용 + 열병합) ÷ 수입, 연도별',\n  inputs: ['gas_balance'],\n  fn: (gas_balance) => gas_balance.map((r) => ({ year: r.year, import_pj: Number(r.import) / 1000, share: (Number(r.power_only) + Number(r.chp)) / Number(r.import) }))\n});\n<\/script>\n\n<script>\n// Numbers in text and tiles\n(function () {\n  const N = window.N2;\n  const fmts = { pct: d3.format('.0%'), f1: (v) => N.f1(Number(v)), f0: (v) => N.f0(Number(v)), f2: (v) => N.f2(Number(v)), r: (v) => d3.format('+.2f')(Number(v)).replace('+', ''), mon: (v) => String(v).replace('-', '.') , pj: (v) => N.f0(Number(v) / 1000), x1: (v) => N.f1(Number(v)) };\n  const spec = {\n    's1-twh': 'f1', 's1-twh11': 'f1', 's1-share': 'pct', 's1-t1': 'f1', 's1-t1b': 'f1', 's1-t2': 'f1', 's1-t2b': 'f1', 's1-t3': 'f0', 's1-t4': 'f0',\n    's2-c1': 'f1', 's2-c2': 'f1', 's2-c3': 'f0', 's2-c4': 'f0', 's2-c5': 'mon', 's2-c6': 'mon', 's2-c7': 'f1', 's2-c8': 'f1', 's2-c9': 'f1', 's2-n1': 'f0', 's2-n2': 'f0', 's2-n3': 'f0', 's2-n4': 'f0', 's2-n5': 'f0', 's2-p1': 'f1', 's2-p2': 'f1', 's2-p3': 'f1', 's2-p4': 'f1', 's2-p5': 'f1', 's2-t1': 'f1', 's2-t2': 'f1', 's2-t3': 'f1', 's2-t4': 'f1', 's2-t5': 'f1',\n    's3-c1': 'f0', 's3-c2': 'f0', 's3-c3': 'x1', 's3-t1': 'f0', 's3-t1m': 'mon', 's3-t2': 'f0', 's3-t2m': 'mon', 's3-t3': 'f1', 's3-t3b': 'f1', 's3-t4': 'f1', 's3-t4b': 'f1',\n    's4-c1': 'r', 's4-c2': 'f0', 's4-c3': 'f0', 's4-c4': 'f0', 's4-c5': 'f0', 's4-t1': 'r', 's4-t2
